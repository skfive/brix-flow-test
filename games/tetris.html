<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>테트리스</title>
<style>
  :root {
    --tetris-board-bg: #111827;
    --tetris-cell-border: #1f2937;
    --tetris-cell-filled: #38bdf8;
    --tetris-text-color: #f8fafc;
    --tetris-restart-bg: #2563eb;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #0b1120;
    color: var(--tetris-text-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px 8px;
  }

  h1 {
    font-size: 1.1rem;
    margin: 0;
    color: var(--tetris-text-color);
  }

  .tetris-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--tetris-text-color);
    width: min(92vw, 320px);
  }

  #tetris-score {
    font-size: 1.25rem;
    font-weight: bold;
  }

  #tetris-status {
    font-size: 1rem;
  }

  .tetris-board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(20, 1fr);
    width: min(92vw, 320px);
    aspect-ratio: 10 / 20;
    background: var(--tetris-board-bg);
    border: 2px solid var(--tetris-cell-border);
    gap: 1px;
    padding: 2px;
  }

  .tetris-row {
    display: contents;
  }

  .tetris-cell {
    background: var(--tetris-board-bg);
    border: 1px solid var(--tetris-cell-border);
  }

  .tetris-cell--filled {
    background: var(--tetris-cell-filled);
  }

  .tetris-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: min(92vw, 320px);
  }

  #tetris-restart {
    background: var(--tetris-restart-bg);
    color: var(--tetris-text-color);
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 1rem;
    cursor: pointer;
  }

  #tetris-restart:focus-visible {
    outline: 2px solid var(--tetris-text-color);
    outline-offset: 2px;
  }

  .tetris-help {
    font-size: 0.8rem;
    color: var(--tetris-text-color);
    opacity: 0.8;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>테트리스</h1>

  <div class="tetris-info">
    <div id="tetris-score">점수: 0</div>
    <div id="tetris-status" role="status" aria-live="polite">준비</div>
  </div>

  <div id="tetris-board" class="tetris-board"></div>

  <div class="tetris-controls">
    <button id="tetris-restart" type="button" aria-label="게임 재시작">재시작</button>
    <p class="tetris-help">← → 이동 · ↑ 회전 · ↓ 소프트드롭</p>
  </div>

<script>
(function () {
  "use strict";

  var BOARD_COLS = 10;
  var BOARD_ROWS = 20;
  var DROP_INTERVAL = 700;

  var TETROMINOES = {
    I: [[1, 1, 1, 1]],
    O: [[1, 1], [1, 1]],
    T: [[0, 1, 0], [1, 1, 1]],
    S: [[0, 1, 1], [1, 1, 0]],
    Z: [[1, 1, 0], [0, 1, 1]],
    J: [[1, 0, 0], [1, 1, 1]],
    L: [[0, 0, 1], [1, 1, 1]]
  };
  var TETROMINO_TYPES = Object.keys(TETROMINOES);

  var SCORE_TABLE = { 1: 100, 2: 300, 3: 500, 4: 800 };

  var STATUS_TEXT = {
    ready: "준비",
    playing: "진행 중",
    gameover: "게임 오버"
  };

  var boardEl = document.getElementById("tetris-board");
  var scoreEl = document.getElementById("tetris-score");
  var statusEl = document.getElementById("tetris-status");
  var restartBtn = document.getElementById("tetris-restart");

  var board = [];
  var score = 0;
  var state = "ready";
  var current = null;
  var dropTimer = null;
  var cellEls = [];

  function createEmptyBoard() {
    var rows = [];
    for (var r = 0; r < BOARD_ROWS; r++) {
      rows.push(new Array(BOARD_COLS).fill(0));
    }
    return rows;
  }

  function buildBoardDom() {
    boardEl.innerHTML = "";
    cellEls = [];
    for (var r = 0; r < BOARD_ROWS; r++) {
      var rowEl = document.createElement("div");
      rowEl.className = "tetris-row";
      var rowCells = [];
      for (var c = 0; c < BOARD_COLS; c++) {
        var cellEl = document.createElement("div");
        cellEl.className = "tetris-cell";
        rowEl.appendChild(cellEl);
        rowCells.push(cellEl);
      }
      boardEl.appendChild(rowEl);
      cellEls.push(rowCells);
    }
  }

  function rotateCW(shape) {
    var rows = shape.length;
    var cols = shape[0].length;
    var result = [];
    for (var c = 0; c < cols; c++) {
      var newRow = [];
      for (var r = rows - 1; r >= 0; r--) {
        newRow.push(shape[r][c]);
      }
      result.push(newRow);
    }
    return result;
  }

  function randomType() {
    return TETROMINO_TYPES[Math.floor(Math.random() * TETROMINO_TYPES.length)];
  }

  function spawnPiece() {
    var type = randomType();
    var shape = TETROMINOES[type];
    var x = Math.floor((BOARD_COLS - shape[0].length) / 2);
    return { type: type, shape: shape, x: x, y: 0 };
  }

  function isValidPosition(targetBoard, shape, x, y) {
    for (var r = 0; r < shape.length; r++) {
      for (var c = 0; c < shape[r].length; c++) {
        if (shape[r][c] !== 1) continue;
        var cellX = x + c;
        var cellY = y + r;
        if (cellX < 0 || cellX >= BOARD_COLS || cellY >= BOARD_ROWS) {
          return false;
        }
        if (cellY >= 0 && targetBoard[cellY][cellX]) {
          return false;
        }
      }
    }
    return true;
  }

  function render() {
    var display = [];
    for (var r = 0; r < BOARD_ROWS; r++) {
      display.push(board[r].slice());
    }
    if (current && state !== "gameover") {
      for (var pr = 0; pr < current.shape.length; pr++) {
        for (var pc = 0; pc < current.shape[pr].length; pc++) {
          if (current.shape[pr][pc] !== 1) continue;
          var y = current.y + pr;
          var x = current.x + pc;
          if (y >= 0 && y < BOARD_ROWS && x >= 0 && x < BOARD_COLS) {
            display[y][x] = 1;
          }
        }
      }
    }
    for (var row = 0; row < BOARD_ROWS; row++) {
      for (var col = 0; col < BOARD_COLS; col++) {
        var el = cellEls[row][col];
        var filled = !!display[row][col];
        el.classList.toggle("tetris-cell--filled", filled);
      }
    }
  }

  function setStatus(nextState) {
    state = nextState;
    statusEl.textContent = STATUS_TEXT[nextState];
  }

  function updateScore(delta) {
    score += delta;
    scoreEl.textContent = "점수: " + score;
  }

  function clearLines() {
    var remaining = board.filter(function (row) {
      return !row.every(function (cell) { return !!cell; });
    });
    var cleared = BOARD_ROWS - remaining.length;
    if (cleared > 0) {
      var newRows = [];
      for (var i = 0; i < cleared; i++) {
        newRows.push(new Array(BOARD_COLS).fill(0));
      }
      board = newRows.concat(remaining);
      updateScore(SCORE_TABLE[cleared] || cleared * 100);
    }
  }

  function lockPiece() {
    for (var r = 0; r < current.shape.length; r++) {
      for (var c = 0; c < current.shape[r].length; c++) {
        if (current.shape[r][c] !== 1) continue;
        var y = current.y + r;
        var x = current.x + c;
        if (y >= 0 && y < BOARD_ROWS && x >= 0 && x < BOARD_COLS) {
          board[y][x] = 1;
        }
      }
    }
    clearLines();
    var next = spawnPiece();
    if (!isValidPosition(board, next.shape, next.x, next.y)) {
      current = null;
      gameOver();
      return;
    }
    current = next;
  }

  function gameOver() {
    stopDropTimer();
    setStatus("gameover");
    render();
  }

  function startDropTimer() {
    stopDropTimer();
    dropTimer = window.setInterval(softDrop, DROP_INTERVAL);
  }

  function stopDropTimer() {
    if (dropTimer !== null) {
      window.clearInterval(dropTimer);
      dropTimer = null;
    }
  }

  function softDrop() {
    if (state !== "playing" || !current) return;
    var nextY = current.y + 1;
    if (isValidPosition(board, current.shape, current.x, nextY)) {
      current.y = nextY;
    } else {
      lockPiece();
    }
    render();
  }

  function move(dx) {
    if (state !== "playing" || !current) return;
    var nextX = current.x + dx;
    if (isValidPosition(board, current.shape, nextX, current.y)) {
      current.x = nextX;
      render();
    }
  }

  function rotate() {
    if (state !== "playing" || !current) return;
    var rotated = rotateCW(current.shape);
    if (isValidPosition(board, rotated, current.x, current.y)) {
      current.shape = rotated;
      render();
    }
  }

  function ensurePlaying() {
    if (state === "ready") {
      setStatus("playing");
      startDropTimer();
    }
  }

  function init() {
    stopDropTimer();
    board = createEmptyBoard();
    score = 0;
    scoreEl.textContent = "점수: 0";
    current = spawnPiece();
    setStatus("ready");
    render();
  }

  document.addEventListener("keydown", function (event) {
    var key = event.key;
    if (key !== "ArrowLeft" && key !== "ArrowRight" && key !== "ArrowUp" && key !== "ArrowDown") {
      return;
    }
    event.preventDefault();
    if (state === "gameover") return;

    ensurePlaying();
    if (state !== "playing") return;

    if (key === "ArrowLeft") {
      move(-1);
    } else if (key === "ArrowRight") {
      move(1);
    } else if (key === "ArrowUp") {
      rotate();
    } else if (key === "ArrowDown") {
      softDrop();
    }
  });

  restartBtn.addEventListener("click", function () {
    init();
  });

  buildBoardDom();
  init();
})();
</script>
</body>
</html>
