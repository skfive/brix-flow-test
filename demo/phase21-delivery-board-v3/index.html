<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전달 상태 보드 v3 / Delivery Status Board v3</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="delivery-board-root" class="delivery-board" data-state="idle">
      <header class="delivery-board__header">
        <h1>전달 상태 보드</h1>
        <p class="delivery-board__revision">revision: <span id="board-revision">—</span></p>
        <button
          id="board-refresh"
          type="button"
          class="delivery-board__refresh"
          aria-label="전달 상태 새로고침"
        >
          새로고침
        </button>
      </header>

      <p
        id="board-status"
        class="delivery-board__status"
        role="status"
        aria-live="polite"
        aria-busy="false"
      >
        대기 중 (idle)
      </p>

      <ul id="board-role-list" class="delivery-board__list" aria-label="역할별 전달 상태"></ul>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
