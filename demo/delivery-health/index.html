<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>전달 상태 요약 패널</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f8fafc;
      }

      /* frozen design token (계약 §6.6) */
      .delivery-health {
        --color-status-progress: #2563eb;
        --color-status-waiting: #d97706;
        --color-status-action: #dc2626;
        --space-panel-gap: 12px;
        --radius-badge: 6px;

        max-width: 640px;
        margin: 0 auto;
        padding: 20px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
      }

      .delivery-health__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-panel-gap);
        margin-bottom: var(--space-panel-gap);
      }

      .delivery-health__title {
        margin: 0;
        font-size: 1.25rem;
      }

      #status-refresh {
        padding: 8px 14px;
        font-size: 0.95rem;
        color: #ffffff;
        background: var(--color-status-progress);
        border: none;
        border-radius: var(--radius-badge);
        cursor: pointer;
      }
      #status-refresh:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      #status-refresh:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      .delivery-health__status {
        min-height: 1.4em;
        margin: 0 0 var(--space-panel-gap);
        color: #475569;
      }

      /* 진행 표시 — loading 상태에서만 노출 (계약 §6.5) */
      .delivery-health__progress {
        display: none;
        height: 4px;
        margin-bottom: var(--space-panel-gap);
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          var(--color-status-progress),
          #93c5fd,
          var(--color-status-progress)
        );
        background-size: 200% 100%;
        animation: dh-progress 1.1s linear infinite;
      }
      .delivery-health[data-state="loading"] .delivery-health__progress {
        display: block;
      }
      @keyframes dh-progress {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: 0 0;
        }
      }

      #status-summary-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-panel-gap);
      }
      #status-summary-list:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
        border-radius: 8px;
      }

      .status-summary-item {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--space-panel-gap);
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }
      .status-summary-item:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }
      .status-summary-item__title {
        font-weight: 600;
      }
      .status-summary-item__next {
        color: #475569;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 10px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #ffffff;
        border-radius: var(--radius-badge);
        white-space: nowrap;
      }
      .status-badge--progress {
        background: var(--color-status-progress);
      }
      .status-badge--waiting {
        background: var(--color-status-waiting);
      }
      .status-badge--action {
        background: var(--color-status-action);
      }

      .empty-state {
        list-style: none;
        padding: 16px;
        color: #64748b;
        text-align: center;
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
      }

      /* 반응형 — 480px 미만 세로 스택 재배치 (계약 §6.8 / AC-7) */
      @media (max-width: 479px) {
        .delivery-health__header {
          flex-direction: column;
          align-items: stretch;
        }
        #status-refresh {
          width: 100%;
        }
        .status-summary-item {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section
        id="delivery-health-root"
        class="delivery-health"
        data-state="loading"
      >
        <header class="delivery-health__header">
          <h1 class="delivery-health__title">전달 상태 요약</h1>
          <button id="status-refresh" type="button" aria-label="상태 새로고침">
            상태 새로고침
          </button>
        </header>

        <span
          class="delivery-health__progress"
          aria-hidden="true"
        ></span>

        <p
          id="delivery-health-status"
          class="delivery-health__status"
          role="status"
          aria-live="polite"
        ></p>

        <ul id="status-summary-list" tabindex="0" aria-label="전달 상태 목록"></ul>
      </section>
    </main>

    <script type="module" src="./src/feature.js"></script>
  </body>
</html>
