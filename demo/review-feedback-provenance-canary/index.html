<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>리뷰 피드백 계보 canary 상태 카드</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --card-bg: #1a1d24;
        --border: #2a2f3a;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --pending: #d9a441;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .status-card {
        width: min(560px, 100%);
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.75rem 2rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      .status-card__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }
      .status-card__title {
        margin: 0;
        font-size: 1.15rem;
      }
      .status-badge {
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--pending);
        color: var(--pending);
        white-space: nowrap;
      }
      .status-card__meta {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .provenance-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.6rem;
      }
      .provenance-item {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.6rem 0.75rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.9rem;
      }
      .provenance-item__label {
        color: var(--muted);
      }
      .provenance-item__value {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <!-- 통제된 검증 프로토콜(1차): 카드 루트에 data-review-cycle="pending" 표식 포함 (초기 상태) -->
    <main>
      <article
        class="status-card"
        data-region="review-feedback-provenance"
        data-review-cycle="pending"
        aria-labelledby="status-card-title"
      >
        <header class="status-card__header">
          <h1 id="status-card-title" class="status-card__title">
            리뷰 피드백 계보 canary
          </h1>
          <span class="status-badge">대기 중 (pending)</span>
        </header>

        <p class="status-card__meta">
          이 카드는 리뷰 피드백의 계보(provenance)를 추적하는 정적 canary
          상태를 보여줍니다. 1차 구현은 초기 <code>pending</code> 상태만
          표시하며, 신규 API·DB·환경변수 없이 정적 데이터만 사용합니다.
        </p>

        <ul class="provenance-list" aria-label="리뷰 피드백 계보 요약">
          <li class="provenance-item">
            <span class="provenance-item__label">계보 단계 (provenance stage)</span>
            <span class="provenance-item__value">초기화 대기</span>
          </li>
          <li class="provenance-item">
            <span class="provenance-item__label">리뷰 사이클 (review cycle)</span>
            <span class="provenance-item__value">pending</span>
          </li>
          <li class="provenance-item">
            <span class="provenance-item__label">데이터 소스</span>
            <span class="provenance-item__value">정적 canary</span>
          </li>
        </ul>
      </article>
    </main>
  </body>
</html>
