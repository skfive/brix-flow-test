<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050510" />
    <title>네온 스네이크 · 전체화면</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- #game-stage: 100dvw × 100dvh 전체화면 무대 (frozen §4.7) -->
    <main id="game-stage" class="stage">
      <!-- 게임 보드: 뷰포트/DPR로부터 파생된 grid를 렌더 -->
      <canvas
        id="game-canvas"
        class="stage__canvas"
        role="img"
        aria-label="네온 스네이크 게임 보드"
      ></canvas>

      <!-- HUD: 플레이 영역 위 오버레이 (grid 크기를 줄이지 않음, frozen §4.7) -->
      <div class="hud" aria-hidden="true">
        <span id="hud-score" class="hud__item">점수 0</span>
        <span id="hud-highscore" class="hud__item">최고 0</span>
      </div>

      <!-- #game-overlay: 상태 텍스트(준비/일시정지/게임오버)를 aria-live로 안내 (frozen §4.6) -->
      <div id="game-overlay" class="overlay" aria-live="polite" role="status">
        <div class="overlay__panel">
          <p class="overlay__text">준비</p>
          <p class="overlay__hint">방향키 · WASD 이동 / Space · P 일시정지</p>
          <button
            id="restart-button"
            class="overlay__button"
            type="button"
            aria-label="게임 시작 또는 다시 시작"
          >
            시작 / 다시 시작
          </button>
        </div>
      </div>

      <!-- #touch-controls: 모바일 방향 패드 (스와이프와 병행) -->
      <div id="touch-controls" class="touch-pad" aria-hidden="true">
        <button class="touch-pad__btn touch-pad__btn--up" type="button" data-dir="up" aria-label="위로">▲</button>
        <button class="touch-pad__btn touch-pad__btn--left" type="button" data-dir="left" aria-label="왼쪽으로">◀</button>
        <button class="touch-pad__btn touch-pad__btn--right" type="button" data-dir="right" aria-label="오른쪽으로">▶</button>
        <button class="touch-pad__btn touch-pad__btn--down" type="button" data-dir="down" aria-label="아래로">▼</button>
      </div>
    </main>

    <script type="module" src="./src/game.js"></script>
  </body>
</html>
