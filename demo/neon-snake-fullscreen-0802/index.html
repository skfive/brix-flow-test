<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a12" />
    <title>네온 스네이크 · 1인 vs CPU / 2인 로컬</title>
    <style>
      /* frozen §3.5 design token (2인 로컬 · 변경 금지) — index.html이 token을 정의한다 */
      :root {
        --color-p1: #00e5ff;
        --color-p2: #ff2fb9;
        --color-food: #ffd400;
        --color-bg: #0a0a12;
        --space-hud-gap: 16px;

        /* frozen ui-contract@v1 §6.3 · 1인 vs CPU 신규 token (additive, exact 값) */
        --color-player1: #39ff14; /* 1P(사람) 뱀 색 */
        --color-cpu: #ff2bd6; /* CPU(2P) 뱀 색 — 사람과 시각적으로 구분 */
        --color-menu-focus: #00e5ff; /* 메뉴 포커스 링 */
        --space-menu-gap: 16px; /* 모드/난이도 메뉴 항목 간격 */

        /* frozen ui-contract@v1 §5.3 · 최고 기록 보드 token (additive, exact 값) */
        --color-scoreboard-accent: #39ff14; /* 최고 기록 강조 (네온 그린) */
        --color-newrecord-flash: #ff2e97; /* 신기록 배지 플래시 (네온 핑크) */
        --space-scoreboard-gap: 12px; /* 보드 내부 항목 간격 */
        --font-scoreboard-size: 18px; /* 보드 텍스트 크기 */

        /* frozen ui-contract@v1 §6.3 · 랭킹 보드 token (BF-1550, additive, exact 값) */
        --snake-rank-accent: #39ff14; /* 랭킹 강조 (네온 그린) */
        --snake-rank-bg: #0a0f0a; /* 보드 배경 */
        --snake-rank-gap: 8px; /* 보드 항목 간격 */
        --snake-rank-radius: 6px; /* 보드/행 모서리 반경 */
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        background: var(--color-bg);
        color: #f4f4ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* frozen §3.3 풀스크린 스테이지 래퍼 (§3.7 100dvw × 100dvh) */
      .snake-stage {
        position: relative;
        width: 100dvw;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* frozen §3.2 게임 보드 — 가용 영역을 채우고 고정 소형 캔버스를 쓰지 않는다(§3.7) */
      #snake-board {
        display: block;
        background: var(--color-bg);
        max-width: 100dvw;
        max-height: 100dvh;
      }

      /* HUD 오버레이 (플레이 영역 위, grid 크기를 줄이지 않음) */
      .hud-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        gap: var(--space-hud-gap);
        padding: 12px 16px;
        pointer-events: none;
      }
      .hud {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-weight: 700;
        text-shadow: 0 0 8px currentColor;
      }
      .hud--p1 {
        color: var(--color-p1);
      }
      .hud--p2 {
        color: var(--color-p2);
      }
      .hud__label {
        font-size: 14px;
        letter-spacing: 0.08em;
      }
      .hud__score {
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }

      /* frozen §3.3/§3.4 상태 배너 — 항상 현재 상태 텍스트를 노출 */
      .status-banner {
        position: absolute;
        top: 52px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(10, 10, 18, 0.72);
        font-size: 14px;
        white-space: nowrap;
      }

      .controls-hint {
        position: absolute;
        bottom: 68px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        font-size: 12px;
        color: rgba(244, 244, 255, 0.72);
        text-align: center;
        white-space: nowrap;
      }

      .controls {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: var(--space-hud-gap);
      }
      /* frozen §3.3 조작 버튼 공통 */
      .control-btn {
        font: inherit;
        font-weight: 700;
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.06);
        color: #f4f4ff;
        cursor: pointer;
      }
      .control-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .control-btn:focus-visible {
        outline: 2px solid var(--color-p1);
        outline-offset: 2px;
      }

      /* frozen §3.3/§3.6 결과(승자/무승부) 오버레이 (2인 로컬 계약 보존, 신규 런타임은 winner-banner 사용) */
      .result-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 18, 0.78);
      }
      .result-overlay[hidden] {
        display: none;
      }
      .result-overlay__text {
        margin: 0;
        font-size: clamp(28px, 8vw, 64px);
        font-weight: 800;
        text-shadow: 0 0 18px currentColor;
      }

      /* frozen ui-contract@v1 §6.2 · 모드/난이도 선택 메뉴 (신규) */
      .mode-menu,
      .difficulty-menu {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: var(--space-menu-gap);
        align-items: stretch;
        max-width: calc(100dvw - 32px);
        z-index: 5;
      }
      .mode-menu[hidden],
      .difficulty-menu[hidden],
      .winner-banner[hidden] {
        display: none;
      }
      .mode-menu__option,
      .difficulty-menu__option {
        font: inherit;
        font-weight: 700;
        padding: 14px 28px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
        color: #f4f4ff;
        cursor: pointer;
        min-width: 220px;
      }
      .mode-menu__option:focus-visible,
      .difficulty-menu__option:focus-visible {
        outline: 3px solid var(--color-menu-focus);
        outline-offset: 2px;
      }
      /* 현재 선택된 난이도만 강조 (색상 외 테두리/그림자로도 구분) */
      .difficulty-menu__option--active {
        border-color: var(--color-menu-focus);
        box-shadow: 0 0 14px var(--color-menu-focus);
        background: rgba(0, 229, 255, 0.16);
      }

      /* frozen ui-contract@v1 §6.2 · 승패 배너 (신규, aria-live 로 결과 텍스트 노출) */
      .winner-banner {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 18, 0.8);
        font-size: clamp(28px, 8vw, 64px);
        font-weight: 800;
        text-shadow: 0 0 18px currentColor;
        z-index: 6;
      }

      /* frozen ui-contract@v1 §5 · 최고 기록 보드 (additive)
         시작(start-idle)·종료(game-over) 화면에서만 노출, 캔버스를 가리지 않도록
         하단 중앙 배치. z-index 로 승패 배너(z-index:6) 위에 표시. */
      .scoreboard {
        position: absolute;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-scoreboard-gap);
        max-width: calc(100dvw - 32px);
        z-index: 7;
        text-align: center;
        pointer-events: none;
        font-size: var(--font-scoreboard-size);
        font-variant-numeric: tabular-nums;
      }
      .scoreboard[hidden] {
        display: none;
      }
      .scoreboard__current {
        font-weight: 700;
        color: #f4f4ff;
        text-shadow: 0 0 8px rgba(244, 244, 255, 0.6);
      }
      .scoreboard__current[hidden] {
        display: none;
      }
      .scoreboard__best {
        font-weight: 800;
        color: var(--color-scoreboard-accent);
        text-shadow: 0 0 10px var(--color-scoreboard-accent);
      }
      .scoreboard__badge {
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 4px 14px;
        border-radius: 999px;
        border: 1px solid var(--color-newrecord-flash);
        color: var(--color-newrecord-flash);
        text-shadow: 0 0 10px var(--color-newrecord-flash);
        box-shadow: 0 0 14px var(--color-newrecord-flash);
      }
      .scoreboard__badge[hidden] {
        display: none;
      }
      .scoreboard__badge--active {
        animation: newrecord-flash 0.9s ease-in-out infinite alternate;
      }
      @keyframes newrecord-flash {
        from {
          opacity: 0.65;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .scoreboard__badge--active {
          animation: none;
        }
      }

      /* frozen ui-contract@v1 §6 · 랭킹 보드 (BF-1550, additive)
         종료(game-over) 화면에서만 노출. 상단 중앙 배치로 하단 최고 기록 보드와 겹치지
         않게 한다. 외곽 패널(.snake-rank__panel)이 위치·배경을 담당하고, 순위 행 목록
         (#snake-rank-board.snake-rank)이 좁은 화면에서 세로 스크롤로 상위 10개를
         모두 노출한다(§6.5). 320px 이상 content overflow 없음(§6.5). */
      .snake-rank__panel {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: var(--snake-rank-gap);
        width: min(360px, calc(100dvw - 32px));
        padding: 12px;
        border-radius: var(--snake-rank-radius);
        background: var(--snake-rank-bg);
        border: 1px solid var(--snake-rank-accent);
        color: #f4f4ff;
        font-variant-numeric: tabular-nums;
        z-index: 8;
      }
      .snake-rank__panel[hidden] {
        display: none;
      }
      .snake-rank {
        display: flex;
        flex-direction: column;
        gap: var(--snake-rank-gap);
        max-height: 40dvh;
        overflow-y: auto;
      }
      .snake-rank__row {
        padding: 6px 10px;
        border-radius: var(--snake-rank-radius);
        background: rgba(57, 255, 20, 0.08);
        color: var(--snake-rank-accent);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .snake-rank__form {
        display: flex;
        gap: var(--snake-rank-gap);
        align-items: center;
      }
      .snake-rank__form input {
        flex: 1 1 auto;
        min-width: 0;
        font: inherit;
        padding: 8px 10px;
        border-radius: var(--snake-rank-radius);
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.06);
        color: #f4f4ff;
      }
      .snake-rank__submit {
        font: inherit;
        font-weight: 700;
        padding: 8px 14px;
        border-radius: var(--snake-rank-radius);
        border: 1px solid var(--snake-rank-accent);
        background: rgba(57, 255, 20, 0.14);
        color: var(--snake-rank-accent);
        cursor: pointer;
        white-space: nowrap;
      }
      .snake-rank__submit:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .snake-rank__submit:focus-visible,
      .snake-rank__form input:focus-visible {
        outline: 2px solid var(--snake-rank-accent);
        outline-offset: 2px;
      }
      #snake-rank-status {
        min-height: 1.2em;
        font-size: 14px;
        color: #f4f4ff;
      }

      /* §3.7 / 반응형 320px 이상에서 overflow 방지 */
      @media (max-width: 480px) {
        .hud__score {
          font-size: 18px;
        }
        .controls-hint {
          font-size: 10px;
        }
        .control-btn {
          padding: 8px 12px;
        }
        .mode-menu__option,
        .difficulty-menu__option {
          min-width: 0;
          padding: 12px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="snake-stage" data-ui-state="mode-selection">
      <!--
        frozen §3.2 snake-board: 풀스크린 게임 보드.
        src/game.js는 모듈 로드 시 getElementById('snake-board')가 있으면 2인 전용 런타임을
        자동 부착한다. 본 페이지는 CPU 주입을 포함한 통합 런타임을 직접 구동하므로,
        보드를 <template>에 담아 game.js 평가 시점에는 DOM에서 감지되지 않게 하고(자동 부착 회피),
        통합 런타임이 마운트한다. selector(#snake-board)는 그대로 보존된다.
      -->
      <template id="board-template">
        <canvas id="snake-board" role="img" aria-label="네온 스네이크 게임 보드"></canvas>
      </template>
      <div id="board-mount"></div>

      <!-- frozen §3.2/§3.6 HUD: 색상 외 '1P'/'2P' 텍스트 라벨로도 구분 -->
      <div class="hud-bar">
        <div id="hud-p1" class="hud hud--p1">
          <span class="hud__label">1P</span>
          <span id="score-p1" class="hud__score">0</span>
        </div>
        <div id="hud-p2" class="hud hud--p2">
          <span class="hud__label">2P</span>
          <span id="score-p2" class="hud__score">0</span>
        </div>
      </div>

      <!-- frozen §3.4 상태 배너: 현재 상태명을 항상 텍스트+접근성 이름으로 노출 -->
      <p id="status-banner" class="status-banner" role="status" aria-live="polite">모드를 선택하세요</p>

      <!-- frozen ui-contract §6.2 모드 선택 메뉴 (기본값: 2인 로컬) -->
      <div id="mode-select" class="mode-menu" role="group" aria-label="게임 모드 선택">
        <button
          id="btn-mode-local"
          class="mode-menu__option"
          type="button"
          aria-label="2인 로컬 대전 시작"
        >
          2인 로컬
        </button>
        <button
          id="btn-mode-cpu"
          class="mode-menu__option"
          type="button"
          aria-label="1인 CPU 대전 시작"
        >
          1인 vs CPU
        </button>
      </div>

      <!-- frozen ui-contract §6.2 난이도 선택 메뉴 (CPU 모드 한정, 현재 선택만 --active) -->
      <div id="difficulty-select" class="difficulty-menu" role="group" aria-label="CPU 난이도 선택" hidden>
        <button
          class="difficulty-menu__option"
          type="button"
          data-value="easy"
          aria-label="쉬움 난이도 선택"
        >
          쉬움
        </button>
        <button
          class="difficulty-menu__option difficulty-menu__option--active"
          type="button"
          data-value="normal"
          aria-label="보통 난이도 선택"
        >
          보통
        </button>
        <button
          class="difficulty-menu__option"
          type="button"
          data-value="hard"
          aria-label="어려움 난이도 선택"
        >
          어려움
        </button>
      </div>

      <p class="controls-hint">
        메뉴: 방향키/Enter · 1P: W A S D · 2P(로컬): 방향키 · Space: 일시정지 / 재개
      </p>

      <!-- frozen §3.2/§3.6 조작 버튼: 명시적 aria-label, 키보드 조작 가능 -->
      <div class="controls">
        <button id="btn-start" class="control-btn" type="button" aria-label="선택 확정 또는 재개">시작</button>
        <button id="btn-pause" class="control-btn" type="button" aria-label="게임 일시정지 또는 재개">일시정지</button>
        <button id="btn-restart" class="control-btn" type="button" aria-label="모드 선택으로 재시작">재시작</button>
      </div>

      <!-- frozen §3.6 결과 오버레이 (2인 로컬 selector 보존, 신규 런타임 미사용) -->
      <div id="result-overlay" class="result-overlay" role="status" aria-live="polite" hidden>
        <p class="result-overlay__text">무승부</p>
      </div>

      <!-- frozen ui-contract §6.2 승패 배너: aria-live="polite" 로 승/패/무승부 텍스트 노출 -->
      <div id="winner-banner" class="winner-banner" role="status" aria-live="polite" hidden></div>

      <!-- frozen ui-contract@v1 §5 최고 기록 보드 (additive): 시작/종료 화면에서 노출.
           색상뿐 아니라 화면 텍스트('이번 점수'/'최고 기록'/'신기록')로 상태를 구분한다. -->
      <div id="snake-highscore-board" class="scoreboard" role="group" hidden>
        <span id="snake-current-score" class="scoreboard__current" hidden>이번 점수 0</span>
        <span id="snake-best-score" class="scoreboard__best" aria-label="최고 기록">최고 기록 0</span>
        <span
          id="snake-newrecord-badge"
          class="scoreboard__badge"
          role="status"
          aria-live="polite"
          hidden
        ></span>
      </div>

      <!-- frozen ui-contract@v1 §6 랭킹 보드 (BF-1550, additive): 종료 화면에서만 노출.
           #snake-rank-board(.snake-rank)는 순위 행(.snake-rank__row)만 담고,
           등록 폼(.snake-rank__form)과 상태(#snake-rank-status)는 형제로 둔다.
           색상뿐 아니라 화면 텍스트로 상태를 구분한다(§6.4). -->
      <div class="snake-rank__panel" hidden>
        <div id="snake-rank-board" class="snake-rank" role="list" aria-label="랭킹 상위 10"></div>
        <form class="snake-rank__form" onsubmit="return false">
          <input
            id="snake-rank-nickname"
            type="text"
            maxlength="12"
            autocomplete="off"
            placeholder="닉네임 (한글/영문/숫자 2~12자)"
            aria-label="닉네임 입력"
          />
          <button
            id="snake-rank-submit"
            class="snake-rank__submit"
            type="button"
            aria-label="랭킹 등록"
          >
            랭킹 등록
          </button>
        </form>
        <p id="snake-rank-status" role="status" aria-live="polite"></p>
      </div>
    </main>

    <script type="module">
      // 통합 런타임 (1인 vs CPU / 2인 로컬). 순수 규칙은 src/game.js, CPU 의사결정은 cpu.js에서 가져온다.
      // src/game.js는 import 시 snake-board가 template 안이라 자동 부착되지 않는다(위 주석 참조).
      import {
        createMultiplayerState,
        startMultiplayer,
        setPlayerDirection,
        pauseMultiplayer,
        resumeMultiplayer,
        restartMultiplayer,
        stepMultiplayer,
        computeBoardMetrics,
        bindingForKey,
        MP_TICK_MS,
        MP_DEFAULT_COLS,
        MP_DEFAULT_ROWS,
      } from './src/game.js';
      import { chooseCpuDirection, createSeededRng } from './cpu.js';
      import {
        loadBest,
        saveBest,
        isNewRecord,
        formatBestText,
        formatCurrentText,
      } from './highscore.js';
      // frozen ui-contract@v1 §6 · 랭킹 보드 (BF-1550, additive)
      import { createScoresStore, createStoreFetch } from './src/scores-api.js';
      import { createRankingBoard } from './src/ranking.js';

      const doc = document;
      const win = window;

      // ---- 보드 마운트 (game.js 자동 부착 회피 후 template를 실제 DOM으로) ----
      doc.getElementById('board-mount').appendChild(
        doc.getElementById('board-template').content.cloneNode(true),
      );
      const board = doc.getElementById('snake-board');
      const ctx = board.getContext('2d');

      // ---- DOM 참조 ----
      const stage = doc.querySelector('.snake-stage');
      const scoreP1 = doc.getElementById('score-p1');
      const scoreP2 = doc.getElementById('score-p2');
      const statusBanner = doc.getElementById('status-banner');
      const modeSelect = doc.getElementById('mode-select');
      const btnModeLocal = doc.getElementById('btn-mode-local');
      const btnModeCpu = doc.getElementById('btn-mode-cpu');
      const difficultySelect = doc.getElementById('difficulty-select');
      const difficultyButtons = Array.from(
        difficultySelect.querySelectorAll('.difficulty-menu__option'),
      );
      const winnerBanner = doc.getElementById('winner-banner');
      const btnStart = doc.getElementById('btn-start');
      const btnPause = doc.getElementById('btn-pause');
      const btnRestart = doc.getElementById('btn-restart');

      // ---- 최고 기록 보드 DOM 참조 (frozen ui-contract@v1 §5.1) ----
      const scoreboard = doc.getElementById('snake-highscore-board');
      const currentScoreEl = doc.getElementById('snake-current-score');
      const bestScoreEl = doc.getElementById('snake-best-score');
      const newRecordBadge = doc.getElementById('snake-newrecord-badge');

      // ---- 랭킹 보드 (frozen ui-contract@v1 §6, planning-contract §7 hook) ----
      // frozen §3.1 네트워크 계층(fetchScores/submitScore)에 fetchImpl 을 주입한다. 정적 데모라
      // 원격 서버가 없으므로 §5 계약을 구현하는 인메모리 저장소를 createStoreFetch 로 백킹하며,
      // 실제 게임 모드('local'/'cpu')를 등록/조회에 전달해 모드별 랭킹을 격리한다(frozen §4).
      const rankFetch = createStoreFetch(createScoresStore());
      const rankPanel = doc.querySelector('.snake-rank__panel');
      const rankingBoard = createRankingBoard({
        boardEl: doc.getElementById('snake-rank-board'),
        nicknameEl: doc.getElementById('snake-rank-nickname'),
        submitEl: doc.getElementById('snake-rank-submit'),
        statusEl: doc.getElementById('snake-rank-status'),
        fetchImpl: rankFetch,
      });
      // 랭킹 보드는 종료 화면에서만 노출한다(플레이/메뉴 중 숨김).
      function showRankPanel(visible) {
        rankPanel.hidden = !visible;
      }

      // localStorage 접근 자체가 실패해도(프라이빗 모드 등) 게임은 정상 시작한다.
      // 조회/저장 예외는 highscore.js 순수 함수가 삼키므로 참조만 안전하게 확보한다.
      const safeStorage = (() => {
        try {
          return win.localStorage;
        } catch {
          return null;
        }
      })();

      // ---- 색상: 로컬은 기존 계약(p1/p2), CPU는 신규 token(player1/cpu) ----
      const COLORS = {
        bg: '#0a0a12',
        food: '#ffd400',
        local: { p1: '#00e5ff', p2: '#ff2fb9' },
        cpu: { p1: '#39ff14', p2: '#ff2bd6' },
      };

      const GAMEOVER = new Set(['p1-win', 'p2-win', 'draw']);
      const CPU_SEED = 0x1a2b3c4d; // 브라우저 CPU rng 고정 시드(재현 가능)

      const UI_STATE_TEXT = {
        'mode-selection': '모드를 선택하세요',
        'difficulty-selection': '난이도를 선택하세요',
        playing: '게임 진행 중',
        paused: '일시정지 — Space로 재개',
        'game-over': '게임 종료',
      };

      // ---- 뷰모델 (엔진 state 밖, 런타임 로컬) ----
      let uiState = 'mode-selection';
      let mode = 'local'; // 기본값: 2인 로컬
      let difficulty = 'normal';
      let modeIndex = 0; // 0=local, 1=cpu
      let state = null; // 엔진 멀티플레이 state (플레이 시작 시 생성)
      let rng = createSeededRng(CPU_SEED);
      let metrics = boardMetrics();

      // ---- 최고 기록 보드 뷰모델 (엔진 state 밖, 런타임 로컬) ----
      let boardBest = 0; // 현재 표시할 최고 기록
      let boardCurrent = 0; // 종료 화면의 "이번 점수"
      let boardNewRecord = false; // 이번 종료가 신기록인가

      function activeCols() {
        return state ? state.cols : MP_DEFAULT_COLS;
      }
      function activeRows() {
        return state ? state.rows : MP_DEFAULT_ROWS;
      }
      function boardMetrics() {
        return computeBoardMetrics(win.innerWidth || 1, win.innerHeight || 1, activeCols(), activeRows());
      }

      // ---- 렌더 ----
      function applyMetrics() {
        metrics = boardMetrics();
        const dpr = win.devicePixelRatio || 1;
        board.width = Math.max(1, Math.round(metrics.boardWidth * dpr));
        board.height = Math.max(1, Math.round(metrics.boardHeight * dpr));
        board.style.width = `${metrics.boardWidth}px`;
        board.style.height = `${metrics.boardHeight}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
      }

      function drawCell(cell, color) {
        const size = metrics.cellPx;
        const pad = Math.max(1, Math.floor(size * 0.08));
        ctx.fillStyle = color;
        ctx.fillRect(cell.x * size + pad, cell.y * size + pad, size - pad * 2, size - pad * 2);
      }

      function render() {
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, metrics.boardWidth, metrics.boardHeight);
        if (metrics.cellPx <= 0 || !state) {
          return;
        }
        const pal = COLORS[mode];
        if (state.food) {
          drawCell(state.food, COLORS.food);
        }
        state.p1.body.forEach((cell) => drawCell(cell, pal.p1));
        state.p2.body.forEach((cell) => drawCell(cell, pal.p2));
      }

      // ---- 승패 텍스트 ----
      function winnerText() {
        if (mode === 'cpu') {
          if (state.state === 'p1-win') return '당신 승리';
          if (state.state === 'p2-win') return 'CPU 승리';
          return '무승부';
        }
        if (state.state === 'p1-win') return '1P 승리';
        if (state.state === 'p2-win') return '2P 승리';
        return '무승부';
      }

      // ---- 뷰 동기화 ----
      function syncView() {
        scoreP1.textContent = state ? String(state.p1.score) : '0';
        scoreP2.textContent = state ? String(state.p2.score) : '0';
        statusBanner.textContent = UI_STATE_TEXT[uiState];
        stage.setAttribute('data-ui-state', uiState);

        modeSelect.hidden = uiState !== 'mode-selection';
        difficultySelect.hidden = uiState !== 'difficulty-selection';

        if (uiState === 'game-over') {
          winnerBanner.textContent = winnerText();
          winnerBanner.hidden = false;
        } else {
          winnerBanner.textContent = '';
          winnerBanner.hidden = true;
        }

        // 후조건(INV-5): 메뉴/종료 상태에서 주 실행 control 재활성, 진행 중에는 start 비활성.
        btnStart.disabled = uiState === 'playing';
        btnPause.disabled = !(uiState === 'playing' || uiState === 'paused');

        // 최고 기록 보드는 현재 뷰모델(board*) 기준으로 매 동기화마다 갱신한다(§6 hook).
        renderScoreboard();
      }

      // ---- 난이도 메뉴 active 표시 ----
      function setDifficulty(value) {
        difficulty = value;
        difficultyButtons.forEach((btn) => {
          btn.classList.toggle('difficulty-menu__option--active', btn.dataset.value === value);
        });
      }

      // ---- 최고 기록 보드 (frozen ui-contract@v1 §5, planning-contract §6 hook) ----
      // 시작 화면에서 강조된 모드(모드 확정 전이므로 modeIndex 기준).
      function highlightedMode() {
        return modeIndex === 1 ? 'cpu' : 'local';
      }

      // 이번 게임의 "점수": CPU 모드는 사람(p1) 점수, 2인 로컬은 두 플레이어 중 높은 점수.
      function currentScoreForMode() {
        if (!state) {
          return 0;
        }
        return mode === 'cpu' ? state.p1.score : Math.max(state.p1.score, state.p2.score);
      }

      function setBadge(active) {
        newRecordBadge.classList.toggle('scoreboard__badge--active', active);
        newRecordBadge.hidden = !active;
        newRecordBadge.textContent = active ? '신기록!' : '';
      }

      // 시작 화면 진입/모드 강조 변경 시 강조 모드의 최고 기록으로 뷰모델 초기화(start-idle).
      function refreshStartBoardVars() {
        boardBest = loadBest(safeStorage, highlightedMode());
        boardCurrent = 0;
        boardNewRecord = false;
      }

      // 보드 렌더: 시작(start-idle)·종료(game-over) 화면에서만 노출, 그 외엔 aria-hidden 비활성.
      function renderScoreboard() {
        const active = uiState === 'mode-selection' || uiState === 'game-over';
        scoreboard.hidden = !active;
        scoreboard.setAttribute('aria-hidden', active ? 'false' : 'true');
        if (!active) {
          setBadge(false);
          return;
        }
        bestScoreEl.textContent = formatBestText(boardBest);
        if (uiState === 'game-over') {
          currentScoreEl.hidden = false;
          currentScoreEl.textContent = formatCurrentText(boardCurrent);
          setBadge(boardNewRecord);
        } else {
          currentScoreEl.hidden = true;
          setBadge(false);
        }
      }

      // ---- 상태 전이 ----
      function goModeSelection() {
        uiState = 'mode-selection';
        state = null;
        modeIndex = mode === 'cpu' ? 1 : 0;
        refreshStartBoardVars();
        // 종료→메뉴 복귀·초기화: 랭킹 보드를 idle 초기값으로 되돌리고 숨긴다(후조건 복원).
        rankingBoard.reset();
        showRankPanel(false);
        syncView();
        applyMetrics();
        focusModeOption();
      }

      function goDifficultySelection() {
        mode = 'cpu';
        uiState = 'difficulty-selection';
        syncView();
        focusActiveDifficulty();
      }

      function startLocal() {
        mode = 'local';
        state = startMultiplayer(createMultiplayerState());
        uiState = 'playing';
        showRankPanel(false); // 플레이 중 랭킹 보드 숨김
        syncView();
        applyMetrics();
        focusBoard();
      }

      function startCpu() {
        mode = 'cpu';
        state = startMultiplayer(createMultiplayerState());
        rng = createSeededRng(CPU_SEED);
        uiState = 'playing';
        showRankPanel(false); // 플레이 중 랭킹 보드 숨김
        syncView();
        applyMetrics();
        focusBoard();
      }

      function togglePause() {
        if (uiState === 'playing') {
          state = pauseMultiplayer(state);
          uiState = 'paused';
        } else if (uiState === 'paused') {
          state = resumeMultiplayer(state);
          uiState = 'playing';
        }
        syncView();
        render();
      }

      function restartToMenu() {
        if (state) {
          state = restartMultiplayer(state);
        }
        state = null;
        goModeSelection();
      }

      function handleGameOver() {
        if (uiState === 'playing' && GAMEOVER.has(state.state)) {
          uiState = 'game-over';
          // 신기록 판정 → 신기록이면 1회 저장(§6 저장 시점) → 최고 기록 갱신값으로 보드 렌더.
          boardCurrent = currentScoreForMode();
          boardNewRecord = isNewRecord(safeStorage, mode, boardCurrent);
          if (boardNewRecord) {
            saveBest(safeStorage, mode, boardCurrent);
          }
          boardBest = loadBest(safeStorage, mode);
          syncView();
          render();
          // 랭킹 보드 노출 + 상위 랭킹 조회(확정 점수·모드 바인딩). 실패해도 게임 흐름 보존.
          showRankPanel(true);
          void rankingBoard.open({ score: boardCurrent, mode });
          if (typeof btnRestart.focus === 'function') {
            btnRestart.focus();
          }
        }
      }

      // ---- 포커스 ----
      function focusBoard() {
        board.setAttribute('tabindex', '-1');
        if (typeof board.focus === 'function') {
          board.focus();
        }
      }
      function focusModeOption() {
        const btn = modeIndex === 1 ? btnModeCpu : btnModeLocal;
        if (typeof btn.focus === 'function') {
          btn.focus();
        }
      }
      function focusActiveDifficulty() {
        const btn = difficultyButtons.find((b) => b.dataset.value === difficulty) || difficultyButtons[0];
        if (typeof btn.focus === 'function') {
          btn.focus();
        }
      }

      // ---- 메뉴 확정 (btn-start / Enter 공통) ----
      function confirmModeSelection() {
        if (modeIndex === 1) {
          goDifficultySelection();
        } else {
          startLocal();
        }
      }

      function primaryAction() {
        if (uiState === 'mode-selection') {
          confirmModeSelection();
        } else if (uiState === 'difficulty-selection') {
          startCpu();
        } else if (uiState === 'paused') {
          togglePause();
        } else if (uiState === 'game-over') {
          restartToMenu();
        }
      }

      // ---- 게임 루프 (고정 tick 누적, CPU는 §5.4대로 step 직전 방향 주입) ----
      let last = null;
      let acc = 0;
      function loop(now) {
        if (last == null) {
          last = now;
        }
        acc += now - last;
        last = now;
        if (uiState === 'playing' && state && state.state === 'running') {
          while (acc >= MP_TICK_MS && state.state === 'running') {
            acc -= MP_TICK_MS;
            if (mode === 'cpu') {
              const dir = chooseCpuDirection(state, { difficulty, rng });
              state = setPlayerDirection(state, 'p2', dir);
            }
            state = stepMultiplayer(state);
          }
          handleGameOver();
        } else {
          acc = 0;
        }
        syncView();
        render();
        win.requestAnimationFrame(loop);
      }

      // ---- 입력 ----
      function moveMenu(delta) {
        if (uiState === 'mode-selection') {
          modeIndex = (modeIndex + delta + 2) % 2;
          refreshStartBoardVars();
          renderScoreboard();
          focusModeOption();
        } else if (uiState === 'difficulty-selection') {
          const order = ['easy', 'normal', 'hard'];
          const idx = (order.indexOf(difficulty) + delta + order.length) % order.length;
          setDifficulty(order[idx]);
          focusActiveDifficulty();
        }
      }

      function onKeyDown(event) {
        const key = event.key;

        // 메뉴 상태: 방향키 이동 / Enter 확정
        if (uiState === 'mode-selection' || uiState === 'difficulty-selection') {
          if (key === 'ArrowUp' || key === 'ArrowLeft') {
            event.preventDefault();
            moveMenu(-1);
            return;
          }
          if (key === 'ArrowDown' || key === 'ArrowRight') {
            event.preventDefault();
            moveMenu(1);
            return;
          }
          if (key === 'Enter') {
            event.preventDefault();
            primaryAction();
            return;
          }
          return;
        }

        // 게임오버: Enter로 모드 선택 복귀
        if (uiState === 'game-over') {
          if (key === 'Enter') {
            event.preventDefault();
            restartToMenu();
          }
          return;
        }

        // 일시정지/재개
        if (key === ' ' || key === 'Spacebar' || key === 'Space') {
          if (uiState === 'playing' || uiState === 'paused') {
            event.preventDefault();
            togglePause();
          }
          return;
        }

        // 진행 중 방향 입력: 1P WASD 항상, 2P 방향키는 로컬 모드에서만(입력 경로 대체, INV-1)
        if (uiState === 'playing') {
          const binding = bindingForKey(key);
          if (!binding) {
            return;
          }
          if (binding.player === 'p2' && mode === 'cpu') {
            return; // CPU 모드에서 사람은 2P를 조작하지 않는다
          }
          event.preventDefault();
          state = setPlayerDirection(state, binding.player, binding.dir);
        }
      }

      // ---- 배선 ----
      btnModeLocal.addEventListener('click', () => {
        modeIndex = 0;
        startLocal();
      });
      btnModeCpu.addEventListener('click', () => {
        modeIndex = 1;
        goDifficultySelection();
      });
      difficultyButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          setDifficulty(btn.dataset.value);
          startCpu();
        });
      });
      btnStart.addEventListener('click', primaryAction);
      btnPause.addEventListener('click', togglePause);
      btnRestart.addEventListener('click', restartToMenu);
      win.addEventListener('keydown', onKeyDown);
      win.addEventListener('resize', applyMetrics);
      win.addEventListener('orientationchange', applyMetrics);

      // ---- 초기화 ----
      setDifficulty(difficulty);
      goModeSelection();
      win.requestAnimationFrame(loop);
    </script>
  </body>
</html>
