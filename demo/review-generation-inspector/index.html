<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰 세대 전환 인스펙터</title>
<style>
  :root {
    /* neutral */
    --rgi-bg:#F8FAFC; --rgi-surface:#FFFFFF; --rgi-surface-muted:#F1F5F9;
    --rgi-border:#E2E8F0; --rgi-text:#0F172A; --rgi-text-secondary:#475569; --rgi-text-muted:#94A3B8;
    /* brand */
    --rgi-primary:#4F46E5; --rgi-primary-hover:#4338CA; --rgi-focus-ring:#6366F1;
    /* semantic — 세대 상태 */
    --rgi-same:#16A34A; --rgi-same-bg:#DCFCE7; --rgi-same-fg:#166534;
    --rgi-new:#2563EB; --rgi-new-bg:#DBEAFE; --rgi-new-fg:#1E40AF;
    --rgi-review:#D97706; --rgi-review-bg:#FEF3C7; --rgi-review-fg:#92400E;
    /* type */
    --rgi-font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --rgi-font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    /* space */
    --rgi-space-1:4px; --rgi-space-2:8px; --rgi-space-3:12px; --rgi-space-4:16px;
    --rgi-space-5:24px; --rgi-space-6:32px; --rgi-space-8:48px;
    --rgi-radius:12px;
    --rgi-shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.10);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--rgi-bg); color:var(--rgi-text);
    font-family:var(--rgi-font-sans); font-size:14px; line-height:1.5; }
  .wrap { max-width:1120px; margin:0 auto; padding:var(--rgi-space-6) var(--rgi-space-5); }
  .mono { font-family:var(--rgi-font-mono); font-size:13px; font-weight:500; }
  .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0; }

  /* ---- header ---- */
  .rgi-header { display:flex; align-items:center; gap:var(--rgi-space-4); flex-wrap:wrap;
    padding-bottom:var(--rgi-space-5); border-bottom:1px solid var(--rgi-border); margin-bottom:var(--rgi-space-6); }
  .rgi-header h1 { font-size:24px; font-weight:700; line-height:1.25; margin:0; }
  .rgi-header .spacer { flex:1 1 auto; }
  .rgi-btn { font:inherit; font-weight:600; font-size:13px; cursor:pointer;
    background:var(--rgi-primary); color:#fff; border:none; border-radius:8px; padding:8px 14px; }
  .rgi-btn:hover { background:var(--rgi-primary-hover); }
  .rgi-btn:focus-visible { outline:2px solid var(--rgi-focus-ring); outline-offset:2px; }
  .rgi-btn--ghost { background:var(--rgi-surface); color:var(--rgi-text); border:1px solid var(--rgi-border); }
  .rgi-btn--ghost:hover { background:var(--rgi-surface-muted); }

  /* ---- badge ---- */
  .rgi-badge { display:inline-flex; align-items:center; gap:6px; border-radius:999px;
    padding:4px 10px; font-size:12px; font-weight:600; line-height:1; border:1px solid transparent; }
  .rgi-badge__icon { font-size:12px; line-height:1; }
  .rgi-badge--same { background:var(--rgi-same-bg); color:var(--rgi-same-fg); border-color:rgba(22,163,74,.25); }
  .rgi-badge--new { background:var(--rgi-new-bg); color:var(--rgi-new-fg); border-color:rgba(37,99,235,.25); }
  .rgi-badge--review { background:var(--rgi-review-bg); color:var(--rgi-review-fg); border-color:rgba(217,119,6,.25); }

  h2.rgi-section { font-size:18px; font-weight:600; line-height:1.33; margin:0 0 var(--rgi-space-4); }
  .rgi-state-block { margin-bottom:var(--rgi-space-8); }
  .rgi-state-block > .lead { color:var(--rgi-text-secondary); font-size:13px; margin:0 0 var(--rgi-space-4); }

  /* ---- input form ---- */
  .rgi-form { display:grid; grid-template-columns:1fr 1fr; gap:var(--rgi-space-4);
    background:var(--rgi-surface); border:1px solid var(--rgi-border); border-radius:var(--rgi-radius);
    box-shadow:var(--rgi-shadow); padding:var(--rgi-space-5); margin-bottom:var(--rgi-space-6); }
  .rgi-field { display:flex; flex-direction:column; gap:6px; }
  .rgi-field label { font-size:12px; font-weight:600; color:var(--rgi-text-secondary); }
  .rgi-field input[type="text"], .rgi-field input[type="number"] {
    font:inherit; font-family:var(--rgi-font-mono); font-size:13px; padding:8px 10px;
    border:1px solid var(--rgi-border); border-radius:8px; background:var(--rgi-surface); color:var(--rgi-text); }
  .rgi-field input:focus-visible { outline:2px solid var(--rgi-focus-ring); outline-offset:2px; }
  .rgi-field .hint { font-size:11px; color:var(--rgi-text-muted); }
  .rgi-field input[aria-invalid="true"] { border-color:var(--rgi-review); }
  .rgi-toggles { grid-column:1 / -1; display:flex; gap:var(--rgi-space-5); flex-wrap:wrap; align-items:center;
    padding-top:var(--rgi-space-2); border-top:1px solid var(--rgi-border); }
  .rgi-toggle { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--rgi-text-secondary); }
  .rgi-toggle input { width:16px; height:16px; }
  .rgi-form__actions { grid-column:1 / -1; display:flex; gap:var(--rgi-space-3); align-items:center; }
  .rgi-error { grid-column:1 / -1; color:var(--rgi-review-fg); font-size:12px; margin:0; min-height:1em; }

  /* ---- timeline ---- */
  .rgi-timeline { display:flex; align-items:flex-start; gap:0; position:relative;
    padding:var(--rgi-space-4) 0; overflow-x:auto; }
  .rgi-timeline__node { appearance:none; background:transparent; border:none; cursor:pointer;
    font:inherit; text-align:center; padding:var(--rgi-space-2); border-radius:8px;
    display:flex; flex-direction:column; align-items:center; gap:6px; min-width:120px; flex:1 0 auto; }
  .rgi-timeline__node:hover { background:var(--rgi-surface-muted); }
  .rgi-timeline__node:focus-visible { outline:2px solid var(--rgi-focus-ring); outline-offset:2px; }
  .rgi-timeline__dot { width:16px; height:16px; border-radius:999px; background:var(--rgi-text-muted);
    box-shadow:0 0 0 4px var(--rgi-surface),0 0 0 5px var(--rgi-border); position:relative; }
  .rgi-timeline__node.is-active .rgi-timeline__dot { box-shadow:0 0 0 4px var(--rgi-surface),0 0 0 6px var(--rgi-primary); }
  .rgi-timeline__node[data-state="same"] .rgi-timeline__dot { background:var(--rgi-same); }
  .rgi-timeline__node[data-state="new"] .rgi-timeline__dot { background:var(--rgi-new); }
  .rgi-timeline__node[data-state="review"] .rgi-timeline__dot { background:var(--rgi-review); }
  .rgi-timeline__line { position:absolute; top:calc(var(--rgi-space-4) + 8px + var(--rgi-space-2)); left:60px; right:60px;
    height:2px; background:var(--rgi-border); z-index:0; }
  .rgi-timeline__sha { font-family:var(--rgi-font-mono); font-size:13px; font-weight:500; }
  .rgi-timeline__ts { font-size:12px; font-weight:500; color:var(--rgi-text-muted); }
  .rgi-timeline__node.is-head .rgi-timeline__sha { font-weight:700; }

  /* ---- comparison ---- */
  .rgi-compare { display:grid; grid-template-columns:1fr 1fr; gap:var(--rgi-space-5); align-items:stretch; }
  .rgi-compare-card { position:relative; background:var(--rgi-surface); border:1px solid var(--rgi-border);
    border-radius:var(--rgi-radius); box-shadow:var(--rgi-shadow); padding:var(--rgi-space-5);
    padding-left:calc(var(--rgi-space-5) + 4px); overflow:hidden; }
  .rgi-compare-card--curr.is-transitioning { animation:rgi-enter 220ms cubic-bezier(.2,.8,.2,1); }
  .rgi-compare-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--rgi-border);
    transition:background 160ms; }
  .rgi-compare-card--curr[data-state="same"]::before { background:var(--rgi-same); }
  .rgi-compare-card--curr[data-state="new"]::before { background:var(--rgi-new); }
  .rgi-compare-card--curr[data-state="review"]::before { background:var(--rgi-review); }
  .rgi-compare-card:hover { box-shadow:0 4px 6px rgba(15,23,42,.08),0 2px 4px rgba(15,23,42,.10); }
  .rgi-compare-card h3 { font-size:15px; font-weight:600; margin:0 0 var(--rgi-space-3);
    display:flex; align-items:center; gap:var(--rgi-space-2); flex-wrap:wrap; }
  .rgi-compare-card .role { color:var(--rgi-text-secondary); font-size:12px; font-weight:600; }
  .rgi-meta { list-style:none; padding:0; margin:0 0 var(--rgi-space-4); display:grid; gap:6px;
    font-size:13px; color:var(--rgi-text-secondary); }
  .rgi-meta b { color:var(--rgi-text); font-weight:600; }
  .rgi-strip { display:flex; align-items:center; gap:var(--rgi-space-2); padding-top:var(--rgi-space-3);
    border-top:1px solid var(--rgi-border); }

  /* ---- detail panel ---- */
  .rgi-detail { margin-top:var(--rgi-space-4); background:var(--rgi-surface-muted); border-radius:10px;
    padding:var(--rgi-space-4); }
  .rgi-detail[hidden] { display:none; }
  .rgi-detail .reason { margin:0 0 var(--rgi-space-3); font-size:13px; color:var(--rgi-text); }
  .rgi-chips { display:flex; gap:var(--rgi-space-2); flex-wrap:wrap; }
  .rgi-chip { font-family:var(--rgi-font-mono); font-size:12px; font-weight:600; padding:4px 8px; border-radius:6px;
    background:var(--rgi-surface); border:1px solid var(--rgi-border); }
  .rgi-chip.add { color:#166534; } .rgi-chip.del { color:#991B1B; } .rgi-chip.warn { color:var(--rgi-review-fg); }

  @keyframes rgi-enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  /* ---- responsive ---- */
  @media (max-width:639px) {
    .rgi-form { grid-template-columns:1fr; }
    .rgi-timeline { flex-direction:column; align-items:flex-start; gap:var(--rgi-space-2); }
    .rgi-timeline__node { flex-direction:row; min-width:0; width:100%; gap:var(--rgi-space-3); text-align:left; }
    .rgi-timeline__line { display:none; }
    .rgi-compare { grid-template-columns:1fr; }
    .rgi-header h1 { flex-basis:100%; }
  }

  @media (prefers-reduced-motion:reduce) {
    .rgi-compare-card--curr.is-transitioning { animation:none; }
    .rgi-compare-card::before { transition:none; }
    * { scroll-behavior:auto !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== HEADER ===== -->
  <header class="rgi-header">
    <h1>리뷰 세대 인스펙터</h1>
    <span id="summary-badge" class="rgi-badge rgi-badge--new" role="status">
      <span class="rgi-badge__icon" aria-hidden="true">↑</span><span data-label>새 세대</span>
    </span>
    <span class="spacer"></span>
    <button id="refresh-btn" class="rgi-btn rgi-btn--ghost" type="button">↻ 초기화</button>
  </header>

  <!-- ===== 입력 폼 ===== -->
  <section class="rgi-state-block" aria-labelledby="input-heading">
    <h2 id="input-heading" class="rgi-section">SHA 입력 · 비교 실행</h2>
    <form id="compare-form" class="rgi-form" novalidate>
      <div class="rgi-field">
        <label for="prev-sha">이전 head SHA</label>
        <input id="prev-sha" name="prev-sha" type="text" autocomplete="off" spellcheck="false"
          value="a1b2c3d4e5f60718293a4b5c6d7e8f9012345678" aria-describedby="prev-hint">
        <span id="prev-hint" class="hint">hex 4~40자</span>
      </div>
      <div class="rgi-field">
        <label for="curr-sha">현재 head SHA</label>
        <input id="curr-sha" name="curr-sha" type="text" autocomplete="off" spellcheck="false"
          value="9f8e7d6c5b4a39281706f5e4d3c2b1a098765432" aria-describedby="curr-hint">
        <span id="curr-hint" class="hint">hex 4~40자</span>
      </div>
      <div class="rgi-toggles">
        <label class="rgi-toggle" for="unresolved">미해결 스레드
          <input id="unresolved" name="unresolved" type="number" min="0" step="1" value="0"
            style="width:64px;font-family:var(--rgi-font-mono);padding:4px 8px;border:1px solid var(--rgi-border);border-radius:6px;">
        </label>
        <label class="rgi-toggle" for="conflict"><input id="conflict" type="checkbox"> 충돌 존재</label>
        <label class="rgi-toggle" for="stale"><input id="stale" type="checkbox"> stale 브랜치</label>
      </div>
      <div class="rgi-form__actions">
        <button id="compare-btn" class="rgi-btn" type="submit">비교 실행</button>
        <span class="hint">Enter 로 실행 · 타임라인은 ←/→(모바일 ↑/↓)로 이동</span>
      </div>
      <p id="form-error" class="rgi-error" role="alert"></p>
    </form>
  </section>

  <!-- ===== 결과 ===== -->
  <section class="rgi-state-block" aria-labelledby="result-heading">
    <h2 id="result-heading" class="rgi-section">세대 판정 결과</h2>
    <p id="live-status" class="visually-hidden" aria-live="polite"></p>

    <div id="timeline" class="rgi-timeline" role="group" aria-label="세대 타임라인 (화살표로 이동, Enter 로 선택)">
      <span class="rgi-timeline__line" aria-hidden="true"></span>
    </div>

    <div class="rgi-compare">
      <article class="rgi-compare-card rgi-compare-card--prev" id="card-prev">
        <h3><span class="role">이전 head</span> <span class="mono" data-prev-sha></span></h3>
        <ul class="rgi-meta">
          <li>시각 <b data-prev-ts>—</b></li>
        </ul>
        <div class="rgi-strip">
          <span class="rgi-badge rgi-badge--same" role="status"><span class="rgi-badge__icon" aria-hidden="true">✓</span>기준</span>
        </div>
      </article>

      <article class="rgi-compare-card rgi-compare-card--curr" id="card-curr" data-state="new"
        tabindex="0" role="button" aria-expanded="true" aria-controls="detail-panel"
        aria-label="현재 head 카드 — Enter 로 상세 열기/닫기">
        <h3><span class="role">현재 head</span> <span class="mono" data-curr-sha></span>
          <span class="rgi-badge rgi-badge--new" id="curr-badge" role="status">
            <span class="rgi-badge__icon" aria-hidden="true">↑</span><span data-label>새 세대</span>
          </span>
        </h3>
        <ul class="rgi-meta">
          <li>시각 <b data-curr-ts>방금</b></li>
          <li>변경 파일 <b data-files>—</b></li>
        </ul>
        <div class="rgi-detail" id="detail-panel">
          <p class="reason" data-reason></p>
          <div class="rgi-chips">
            <span class="rgi-chip add" data-add>+0</span>
            <span class="rgi-chip del" data-del>−0</span>
            <span class="rgi-chip" data-unresolved-chip>미해결 0</span>
          </div>
        </div>
      </article>
    </div>
  </section>

</div>

<script type="module">
import { judgeGeneration, shortSha, isValidSha, STATE_META, describeState, relativeTime } from './inspector.js';

const $ = (sel) => document.querySelector(sel);
const badgeClass = (state) => `rgi-badge rgi-badge--${state}`;

// ---- 로컬 상태 (외부 API 없음) ----
/** @type {{sha:string, state:string, at:number}[]} */
let history = [];
let selectedIndex = 0; // 타임라인에서 "현재"로 선택된 노드 인덱스

const prevInput = $('#prev-sha');
const currInput = $('#curr-sha');
const unresolvedInput = $('#unresolved');
const conflictInput = $('#conflict');
const staleInput = $('#stale');
const errorEl = $('#form-error');
const timelineEl = $('#timeline');
const detailEl = $('#detail-panel');
const currCard = $('#card-curr');

function readInputs() {
  return {
    prevHeadSha: prevInput.value.trim(),
    currHeadSha: currInput.value.trim(),
    unresolvedThreads: Math.max(0, Number(unresolvedInput.value) || 0),
    hasConflict: conflictInput.checked,
    isStale: staleInput.checked,
  };
}

function validate(input) {
  const problems = [];
  if (!isValidSha(input.prevHeadSha)) problems.push('이전 head SHA');
  if (!isValidSha(input.currHeadSha)) problems.push('현재 head SHA');
  prevInput.setAttribute('aria-invalid', String(!isValidSha(input.prevHeadSha)));
  currInput.setAttribute('aria-invalid', String(!isValidSha(input.currHeadSha)));
  return problems;
}

// 결정론적 데모용 파일수: SHA hex 앞 3자리를 정수화 → 상태별 규칙
function derivedFiles(input, state) {
  if (state === 'same') return 0;
  const n = parseInt(input.currHeadSha.slice(0, 3), 16) % 12;
  return n === 0 ? 1 : n;
}

function render() {
  if (history.length === 0) return;
  const idx = Math.min(selectedIndex, history.length - 1);
  const curr = history[idx];
  const prev = idx > 0 ? history[idx - 1] : history[idx];
  const now = Date.now();

  const input = {
    prevHeadSha: prev.sha,
    currHeadSha: curr.sha,
    unresolvedThreads: curr.unresolvedThreads,
    hasConflict: curr.hasConflict,
    isStale: curr.isStale,
  };
  const state = curr.state;
  const meta = STATE_META[state];

  // 헤더 요약 배지
  const summary = $('#summary-badge');
  summary.className = badgeClass(state);
  summary.querySelector('.rgi-badge__icon').textContent = meta.icon;
  summary.querySelector('[data-label]').textContent = meta.label;

  // 타임라인
  renderTimeline();

  // 비교 카드
  $('[data-prev-sha]').textContent = shortSha(prev.sha);
  $('[data-prev-sha]').setAttribute('title', prev.sha);
  $('[data-prev-ts]').textContent = relativeTime(new Date(prev.at).toISOString(), now);
  $('[data-curr-sha]').textContent = shortSha(curr.sha);
  $('[data-curr-sha]').setAttribute('title', curr.sha);
  $('[data-curr-ts]').textContent = relativeTime(new Date(curr.at).toISOString(), now);
  $('[data-files]').textContent = String(curr.files);

  currCard.setAttribute('data-state', state);
  const currBadge = $('#curr-badge');
  currBadge.className = badgeClass(state);
  currBadge.querySelector('.rgi-badge__icon').textContent = meta.icon;
  currBadge.querySelector('[data-label]').textContent = meta.label;

  // 상세 패널
  $('[data-reason]').textContent = describeState(state, input);
  $('[data-add]').textContent = `+${curr.files * 40}`;
  $('[data-del]').textContent = `−${curr.files * 12}`;
  const uc = $('[data-unresolved-chip]');
  uc.textContent = `미해결 ${curr.unresolvedThreads}`;
  uc.classList.toggle('warn', curr.unresolvedThreads > 0);

  // 전환 이펙트
  currCard.classList.remove('is-transitioning');
  // reflow 로 애니메이션 재시작
  void currCard.offsetWidth;
  currCard.classList.add('is-transitioning');

  // aria-live 안내
  $('#live-status').textContent =
    `판정: ${meta.label}. ${describeState(state, input)}`;
}

function renderTimeline() {
  // 기존 노드 제거 (line 은 유지)
  timelineEl.querySelectorAll('.rgi-timeline__node').forEach((n) => n.remove());
  const now = Date.now();
  history.forEach((ev, i) => {
    const node = document.createElement('button');
    node.type = 'button';
    node.className = 'rgi-timeline__node';
    node.dataset.state = ev.state;
    node.dataset.index = String(i);
    const isSelected = i === selectedIndex;
    const isHead = i === history.length - 1;
    if (isSelected) node.classList.add('is-active');
    if (isHead) node.classList.add('is-head');
    node.tabIndex = isSelected ? 0 : -1;
    if (isSelected) node.setAttribute('aria-current', 'true');
    node.setAttribute('aria-label',
      `${isHead ? '현재 head ' : ''}${shortSha(ev.sha)}, ${STATE_META[ev.state].label}`);
    node.innerHTML =
      `<span class="rgi-timeline__dot" aria-hidden="true"></span>` +
      `<span class="rgi-timeline__sha">${shortSha(ev.sha)}</span>` +
      `<span class="rgi-timeline__ts">${isHead ? '현재 head' : relativeTime(new Date(ev.at).toISOString(), now)}</span>`;
    node.addEventListener('click', () => selectNode(i));
    timelineEl.appendChild(node);
  });
}

function selectNode(i) {
  selectedIndex = Math.max(0, Math.min(i, history.length - 1));
  render();
  const node = timelineEl.querySelector(`.rgi-timeline__node[data-index="${selectedIndex}"]`);
  if (node) node.focus();
}

// roving tabindex 화살표 이동 (←/→/↑/↓)
timelineEl.addEventListener('keydown', (e) => {
  if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) return;
  e.preventDefault();
  let next = selectedIndex;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next -= 1;
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next += 1;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = history.length - 1;
  next = (next + history.length) % history.length;
  selectNode(next);
});

// 현재 head 카드: Enter/Space → 상세 토글, Esc → 닫기
currCard.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    toggleDetail();
  } else if (e.key === 'Escape') {
    setDetail(false);
  }
});
currCard.addEventListener('click', (e) => {
  // 카드 자체 클릭 시 토글 (배지/텍스트 선택 방해 최소화)
  if (e.target.closest('.rgi-detail')) return;
  toggleDetail();
});
function toggleDetail() {
  setDetail(detailEl.hidden);
}
function setDetail(open) {
  detailEl.hidden = !open;
  currCard.setAttribute('aria-expanded', String(open));
  if (open) currCard.focus();
}

// 비교 실행
function runCompare() {
  const input = readInputs();
  const problems = validate(input);
  if (problems.length > 0) {
    errorEl.textContent = `${problems.join(', ')} 값이 올바르지 않습니다 (hex 4~40자).`;
    return;
  }
  errorEl.textContent = '';

  const state = judgeGeneration(input);
  const now = Date.now();

  // 이전 head 이벤트 (기준). 최초 실행 시 history 초기화.
  const prevEvent = {
    sha: input.prevHeadSha,
    state: 'same',
    at: now - 2 * 24 * 3600 * 1000, // 2일 전(데모)
    unresolvedThreads: 0, hasConflict: false, isStale: false, files: 0,
  };
  const currEvent = {
    sha: input.currHeadSha,
    state,
    at: now,
    unresolvedThreads: input.unresolvedThreads,
    hasConflict: input.hasConflict,
    isStale: input.isStale,
    files: derivedFiles(input, state),
  };

  if (input.prevHeadSha === input.currHeadSha) {
    history = [currEvent];
  } else {
    history = [prevEvent, currEvent];
  }
  selectedIndex = history.length - 1;
  setDetail(true);
  render();
}

$('#compare-form').addEventListener('submit', (e) => {
  e.preventDefault();
  runCompare();
});
$('#refresh-btn').addEventListener('click', () => {
  prevInput.value = 'a1b2c3d4e5f60718293a4b5c6d7e8f9012345678';
  currInput.value = '9f8e7d6c5b4a39281706f5e4d3c2b1a098765432';
  unresolvedInput.value = '0';
  conflictInput.checked = false;
  staleInput.checked = false;
  runCompare();
});

// 초기 렌더 (페이지 로드 시 로컬 상태만으로 동작)
runCompare();
</script>
