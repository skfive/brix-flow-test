<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>납품 추적 상태 보드 · delivery-trace-canary</title>
    <link rel="stylesheet" href="/apps/web/src/demo/delivery-trace-canary/styles.css" />
  </head>
  <body>
    <main>
      <h1>납품 추적 상태 보드</h1>
      <p>Requirement → Design → Implementation → Review → Test 5단계 추적 상태를 읽기 전용으로 보여줍니다.</p>
      <noscript>
        <p>이 보드는 정적 초기 상태로 표시되며, 상호작용(단계 선택·필터)은 JavaScript 활성화 시 동작합니다.</p>
      </noscript>
      <!-- index.js 가 로드되면 이 root 를 동일 보드로 재렌더(강화)한다. 정적 초기 마크업은 no-JS/route smoke 용. -->
      <div id="delivery-trace-board-root">
        <section id="delivery-trace-board" class="delivery-trace" data-state="evidence-missing">
          <header class="delivery-trace__header">
            <p class="delivery-trace__status" data-state="evidence-missing">상태: 누락 evidence 있음</p>
            <div class="delivery-trace__controls">
              <label class="delivery-trace__filter-label" for="trace-stage-filter">단계 상태 필터</label>
              <select id="trace-stage-filter" aria-label="단계 상태 필터">
                <option value="all" selected>전체</option>
                <option value="complete">완료</option>
                <option value="pending">진행 중</option>
                <option value="missing">누락</option>
              </select>
            </div>
          </header>
          <div id="evidence-warning-banner" role="alert" aria-label="누락 evidence 경고">누락 evidence: 검토, 테스트</div>
          <div class="delivery-trace__body">
            <ol class="delivery-trace__rows">
              <li class="delivery-trace__row" data-row-id="R1">
                <p class="delivery-trace__requirement">R1. 5단계 추적 카드 렌더</p>
                <div class="delivery-trace__stages">
                  <button type="button" class="delivery-trace__stage delivery-trace__stage--complete" data-cell-id="R1:requirement" data-stage="requirement" data-status="complete" aria-label="요구사항 완료(Complete)"><span class="delivery-trace__stage-name">요구사항</span><span class="delivery-trace__stage-status">완료</span></button>
                  <button type="button" class="delivery-trace__stage delivery-trace__stage--complete" data-cell-id="R1:design" data-stage="design" data-status="complete" aria-label="설계 완료(Complete)"><span class="delivery-trace__stage-name">설계</span><span class="delivery-trace__stage-status">완료</span></button>
                  <button type="button" class="delivery-trace__stage delivery-trace__stage--complete" data-cell-id="R1:implementation" data-stage="implementation" data-status="complete" aria-label="구현 완료(Complete)"><span class="delivery-trace__stage-name">구현</span><span class="delivery-trace__stage-status">완료</span></button>
                  <button type="button" class="delivery-trace__stage delivery-trace__stage--complete" data-cell-id="R1:review" data-stage="review" data-status="complete" aria-label="검토 완료(Complete)"><span class="delivery-trace__stage-name">검토</span><span class="delivery-trace__stage-status">완료</span></button>
                  <button type="button" class="delivery-trace__stage delivery-trace__stage--complete" data-cell-id="R1:test" data-stage="test" data-status="complete" aria-label="테스트 완료(Complete)"><span class="delivery-trace__stage-name">테스트</span><span class="delivery-trace__stage-status">완료</span></button>
                </div>
              </li>
              <li class="delivery-trace__row" data-row-id="R3">
                <p class="delivery-trace__requirement">R3. 누락 evidence 경고</p>
                <div class="delivery-trace__stages">
                  <button type="button" class="delivery-trace__stage delivery-trace__stage--complete" data-cell-id="R3:implementation" data-stage="implementation" data-status="complete" aria-label="구현 완료(Complete)"><span class="delivery-trace__stage-name">구현</span><span class="delivery-trace__stage-status">완료</span></button>
                  <button type="button" class="delivery-trace__stage" data-cell-id="R3:review" data-stage="review" data-status="pending" aria-label="검토 진행 중(Pending)"><span class="delivery-trace__stage-name">검토</span><span class="delivery-trace__stage-status">진행 중</span></button>
                  <button type="button" class="delivery-trace__stage delivery-trace__stage--missing" data-cell-id="R3:test" data-stage="test" data-status="missing" aria-label="테스트 누락(Missing)"><span class="delivery-trace__stage-name">테스트</span><span class="delivery-trace__stage-status">누락</span></button>
                </div>
              </li>
            </ol>
            <aside id="trace-detail-panel" class="delivery-trace__detail" tabindex="-1" aria-label="단계 상세" data-empty="true">
              <p>단계 카드를 선택하면 상세 evidence 가 표시됩니다.</p>
            </aside>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/apps/web/src/demo/delivery-trace-canary/index.js"></script>
  </body>
</html>
