<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>스톱워치</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stopwatch" aria-label="스톱워치">
      <p id="stopwatch-state" aria-live="polite">상태: 대기</p>

      <div
        id="stopwatch-display"
        class="stopwatch__display"
        role="timer"
        aria-live="off"
      >
        00:00.00
      </div>

      <div class="stopwatch__controls">
        <button type="button" id="stopwatch-start" aria-label="시작">
          시작
        </button>
        <button
          type="button"
          id="stopwatch-pause"
          aria-label="일시정지"
          disabled
        >
          일시정지
        </button>
        <button
          type="button"
          id="stopwatch-lap"
          aria-label="랩 기록"
          disabled
          aria-disabled="true"
        >
          랩 기록
        </button>
        <button
          type="button"
          id="stopwatch-reset"
          aria-label="리셋"
          disabled
        >
          리셋
        </button>
      </div>

      <ol
        id="stopwatch-lap-list"
        class="stopwatch__lap-list"
        aria-label="랩 기록 목록"
      ></ol>
    </main>

    <script src="stopwatch.js"></script>
  </body>
</html>
