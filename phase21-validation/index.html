<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>전달 상태 배지</title>
    <style>
      /* frozen 디자인 토큰 (§3.4) — selector/token 재정의 금지 (additive) */
      :root {
        --color-status-success: #16a34a;
        --color-status-pending: #f59e0b;
        --color-status-error: #dc2626;
        --space-badge-gap: 8px;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 24px;
      }

      /* 루트: 배지 + 갱신 시각. 좁은 화면에서 세로 재배치 (§3.6, AC-6) */
      .delivery-status {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-badge-gap);
        max-width: 100%;
      }

      /* 배지: 색상 + 텍스트 라벨(색상 단독 구분 금지, AC-5). 색상은 data-status 토큰 매핑 */
      .delivery-status__badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        font-weight: 600;
        color: #fff;
        background: var(--color-status-pending); /* 기본 loading */
        white-space: nowrap;
      }
      .delivery-status__badge[data-status="loading"] {
        background: var(--color-status-pending);
      }
      .delivery-status__badge[data-status="ready"] {
        background: var(--color-status-success);
      }
      .delivery-status__badge[data-status="error"],
      .delivery-status__badge[data-status="forbidden"] {
        background: var(--color-status-error);
      }

      .delivery-status__timestamp {
        color: #475569;
        font-size: 0.875rem;
      }
      .delivery-status__timestamp[hidden] {
        display: none;
      }

      .delivery-status__refresh {
        padding: 4px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      .delivery-status__refresh:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      /* 320px 이하 좁은 화면: overflow 없이 세로 재배치 (§3.6) */
      @media (max-width: 360px) {
        .delivery-status {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>전달 상태</h1>
      <!-- frozen DOM 구조 (§3.2): root(aria-live=polite) > badge, timestamp -->
      <section
        id="delivery-status-root"
        class="delivery-status"
        aria-live="polite"
        aria-label="전달 상태"
      >
        <span
          id="delivery-status-badge"
          class="delivery-status__badge"
          role="status"
          data-status="loading"
        >진행 중</span>
        <time
          id="delivery-status-timestamp"
          class="delivery-status__timestamp"
          hidden
        ></time>
        <button
          type="button"
          class="delivery-status__refresh"
          data-role="delivery-status-refresh"
          aria-label="전달 상태 새로고침"
        >새로고침</button>
      </section>
    </main>
    <script type="module" src="./src/delivery-status.js"></script>
  </body>
</html>
