<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>습관 트래커</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="habit-tracker-root" data-state="empty">
    <h1>습관 트래커</h1>

    <p id="habit-state-label" class="habit-state-label">상태: 비어있음</p>

    <form id="habit-form">
      <label for="habit-name-input">습관 이름</label>
      <input
        type="text"
        id="habit-name-input"
        aria-label="습관 이름 입력"
        placeholder="예: 운동, 독서"
        autocomplete="off"
      />
      <button type="submit" id="habit-add-button">추가</button>
    </form>

    <p id="habit-error-message" role="alert"></p>

    <div id="weekly-summary" class="summary-bar"></div>

    <div id="habit-grid"></div>
  </main>

  <script type="module" src="habits.js"></script>
</body>
</html>
