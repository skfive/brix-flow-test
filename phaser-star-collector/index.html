<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Collector</title>
    <style>
      :root {
        --color-bg: #0f172a;
        --color-player: #38bdf8;
        --color-star: #fbbf24;
        --color-hazard: #ef4444;
        --color-hud-text: #f8fafc;
        --font-hud-size: 20px;
        --font-title-size: 40px;
        --space-hud-gap: 12px;
        --radius-panel: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-bg);
        color: var(--color-hud-text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: var(--space-hud-gap);
      }

      #game-root {
        position: relative;
        width: 100%;
        max-width: 800px;
        display: flex;
        flex-direction: column;
        gap: var(--space-hud-gap);
      }

      .hud {
        display: flex;
        align-items: center;
        gap: var(--space-hud-gap);
      }

      .hud__score {
        font-size: var(--font-hud-size);
        font-weight: 700;
        color: var(--color-hud-text);
      }

      /* 캔버스 컨테이너: 4:3 종횡비 유지, 컨테이너 폭에 맞춰 축소 */
      #game-canvas {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: var(--color-bg);
        border-radius: var(--radius-panel);
        overflow: hidden;
      }

      #game-canvas canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-hud-gap);
        text-align: center;
        padding: var(--space-hud-gap);
        background: rgba(15, 23, 42, 0.82);
        border-radius: var(--radius-panel);
      }

      /* overlay는 #game-canvas 위에 겹쳐 표시 */
      #game-canvas .overlay,
      .overlay {
        z-index: 2;
      }

      #overlay-title {
        margin: 0;
        font-size: var(--font-title-size);
        line-height: 1.2;
        color: var(--color-hud-text);
      }

      .overlay--start #overlay-title {
        color: var(--color-star);
      }

      .overlay--paused #overlay-title {
        color: var(--color-player);
      }

      .overlay--gameover #overlay-title {
        color: var(--color-hazard);
      }

      .button {
        font-size: var(--font-hud-size);
        padding: 10px 20px;
        border: none;
        border-radius: var(--radius-panel);
        cursor: pointer;
        color: var(--color-bg);
        background: var(--color-hud-text);
        font-weight: 700;
      }

      .button--primary {
        background: var(--color-player);
      }

      .button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main id="game-root">
      <div class="hud">
        <span id="hud-score" class="hud__score" aria-live="polite">점수: 0</span>
      </div>

      <div id="game-canvas">
        <div
          id="game-overlay"
          class="overlay overlay--start"
          role="status"
        >
          <h1 id="overlay-title">시작 — 방향키 이동 · 스페이스 점프</h1>
          <button
            id="restart-button"
            class="button button--primary"
            type="button"
            aria-label="게임 다시 시작"
          >
            시작
          </button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
