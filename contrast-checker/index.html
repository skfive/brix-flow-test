<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>색상 대비 검사기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="contrast-checker">
  <h1>색상 대비 검사기</h1>

  <p id="contrast-error" class="contrast-checker__error" role="alert"></p>

  <div class="contrast-checker__field">
    <label for="contrast-foreground-input">전경색 (hex)</label>
    <input
      type="text"
      id="contrast-foreground-input"
      class="contrast-checker__input"
      aria-label="전경색 (hex)"
      placeholder="#000000"
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <div class="contrast-checker__field">
    <label for="contrast-background-input">배경색 (hex)</label>
    <input
      type="text"
      id="contrast-background-input"
      class="contrast-checker__input"
      aria-label="배경색 (hex)"
      placeholder="#FFFFFF"
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <section class="contrast-checker__result-card" aria-label="대비 결과">
    <p>대비비: <span id="contrast-ratio-value">–</span></p>
    <p>AA (일반 텍스트): <span id="contrast-aa-result">미입력</span></p>
    <p>AAA (일반 텍스트): <span id="contrast-aaa-result">미입력</span></p>
    <p>AA (큰 텍스트): <span id="contrast-aa-large-result">미입력</span></p>
  </section>

  <div id="contrast-preview" class="contrast-checker__preview">가나다 Aa 대비 미리보기</div>
</main>
<script type="module" src="contrast.js"></script>
</body>
</html>
