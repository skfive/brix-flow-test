<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>컬러 팔레트 생성기</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="palette-root" class="palette">
      <h1 class="palette__title">컬러 팔레트 생성기</h1>

      <div class="palette__input-group">
        <input
          type="text"
          id="hex-input"
          aria-label="기준 색상 hex 코드"
          placeholder="#3b82f6"
          value="#3b82f6"
        />
        <input type="color" id="color-picker" value="#3b82f6" />
        <button type="button" id="random-btn">무작위</button>
      </div>

      <div id="palette-swatches"></div>

      <p id="error-message" role="alert" hidden></p>
    </div>

    <script src="./palette.js"></script>
  </body>
</html>
