<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>컬러 팔레트 생성기</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="palette-app" data-state="idle">
      <h1>컬러 팔레트 생성기</h1>

      <div class="palette-controls">
        <input
          type="text"
          id="hex-input"
          aria-label="HEX 색상 코드 입력"
          placeholder="#2563EB"
        />
        <input type="color" id="color-picker" value="#2563eb" />
        <button type="button" id="generate-btn" aria-label="팔레트 생성">
          팔레트 생성
        </button>
        <button type="button" id="reset-btn">초기화</button>
      </div>

      <div id="swatch-list"></div>

      <p id="status-message" role="status"></p>
    </div>

    <script src="./palette.js"></script>
  </body>
</html>
