<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 강도 검사기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <h1>비밀번호 강도 검사기</h1>

  <div class="field">
    <label for="password-input">비밀번호</label>
    <div class="input-row">
      <input
        type="password"
        id="password-input"
        aria-label="비밀번호"
        autocomplete="new-password"
      >
      <button
        type="button"
        id="toggle-visibility"
        aria-pressed="false"
        aria-label="비밀번호 표시"
      >👁</button>
    </div>
  </div>

  <div
    id="strength-meter"
    class="strength-bar"
    role="progressbar"
    aria-valuenow="0"
    aria-valuemin="0"
    aria-valuemax="4"
  >
    <div class="strength-bar__fill"></div>
  </div>
  <p id="strength-label">비밀번호를 입력하세요</p>

  <ul id="rules-list">
    <li class="rule rule--unmet" data-rule="length">8자 이상 (미충족)</li>
    <li class="rule rule--unmet" data-rule="uppercase">대문자 포함 (미충족)</li>
    <li class="rule rule--unmet" data-rule="lowercase">소문자 포함 (미충족)</li>
    <li class="rule rule--unmet" data-rule="number">숫자 포함 (미충족)</li>
    <li class="rule rule--unmet" data-rule="special">특수문자 포함 (미충족)</li>
  </ul>
</main>
<script type="module" src="strength.js"></script>
</body>
</html>
