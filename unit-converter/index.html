<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단위 변환기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="unit-converter-root">
  <h1>단위 변환기</h1>

  <div id="category-tabs" role="tablist" aria-label="변환 카테고리">
    <button type="button" id="tab-length" class="tab tab--active" role="tab" aria-selected="true">길이</button>
    <button type="button" id="tab-weight" class="tab" role="tab" aria-selected="false">무게</button>
    <button type="button" id="tab-temperature" class="tab" role="tab" aria-selected="false">온도</button>
  </div>

  <p id="direction-label" class="direction-label" aria-live="polite"></p>

  <div class="field">
    <label for="input-value">입력값</label>
    <input type="text" id="input-value" class="converter-input" inputmode="decimal" autocomplete="off" placeholder="값을 입력하세요">
  </div>

  <button type="button" id="swap-direction" class="swap-button" aria-label="단위 방향 전환">⇄</button>

  <div class="field">
    <label for="output-value">결과</label>
    <p id="output-value" class="converter-output"></p>
  </div>

  <p id="error-message" class="error-text" aria-live="polite"></p>
</main>
<script src="convert.js"></script>
</body>
</html>
