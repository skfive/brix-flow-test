<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단위 변환기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="converter-app">
  <h1>단위 변환기</h1>

  <div id="category-tabs" role="tablist" aria-label="변환 카테고리">
    <button type="button" id="tab-length" class="tab tab--active" role="tab" aria-selected="true">길이</button>
    <button type="button" id="tab-weight" class="tab" role="tab" aria-selected="false">무게</button>
    <button type="button" id="tab-temperature" class="tab" role="tab" aria-selected="false">온도</button>
  </div>

  <div class="converter-form">
    <div class="field">
      <label for="value-input">입력값</label>
      <input type="text" id="value-input" inputmode="decimal" autocomplete="off" placeholder="값을 입력하세요">
    </div>

    <div class="field">
      <label for="from-unit-select">출발 단위</label>
      <select id="from-unit-select" class="unit-select"></select>
    </div>

    <button type="button" id="swap-button" class="swap-btn" aria-label="단위 교환">⇄</button>

    <div class="field">
      <label for="to-unit-select">도착 단위</label>
      <select id="to-unit-select" class="unit-select"></select>
    </div>

    <div class="field">
      <label for="result-output">결과</label>
      <p id="result-output" class="result"></p>
    </div>
  </div>

  <p id="error-message" role="alert"></p>
</main>
<script src="converter.js"></script>
</body>
</html>
