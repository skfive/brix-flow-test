<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단위 변환기</title>
<style>
  :root {
    --color-bg-light: #ffffff;
    --color-bg-dark: #121212;
    --color-text-light: #1a1a1a;
    --color-text-dark: #f5f5f5;
    --color-accent: #2563eb;
    --color-error: #dc2626;
    --space-control-gap: 12px;
    --radius-control: 8px;
    color-scheme: light dark;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--color-bg-light);
    color: var(--color-text-light);
    padding: var(--space-control-gap);
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: var(--color-bg-dark);
      color: var(--color-text-dark);
    }
  }

  #app-root {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  #app-root > h1 {
    font-size: 1.25rem;
    margin: 0 0 var(--space-control-gap);
  }

  #app-root > p[aria-live] {
    font-size: 0.875rem;
    margin: 0 0 var(--space-control-gap);
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-control-gap);
    margin-bottom: var(--space-control-gap);
  }

  .tab {
    flex: 1 1 auto;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid var(--color-accent);
    border-radius: var(--radius-control);
    background: transparent;
    color: inherit;
    font-size: 1rem;
    cursor: pointer;
  }

  .tab--active {
    background: var(--color-accent);
    color: #ffffff;
  }

  .panel {
    display: none;
  }

  .panel--active {
    display: block;
  }

  .unit-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: var(--space-control-gap);
  }

  .unit-row > span {
    font-size: 0.875rem;
    font-weight: 600;
  }

  .unit-input {
    width: 100%;
    padding: 8px;
    font-size: 1rem;
    border: 1px solid var(--color-accent);
    border-radius: var(--radius-control);
    background: inherit;
    color: inherit;
  }

  .error-text {
    color: var(--color-error);
    font-weight: 600;
    min-height: 1.2em;
    margin: var(--space-control-gap) 0 0;
  }

  @media (min-width: 768px) {
    .panel--active {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-control-gap);
      align-content: start;
    }
  }
</style>
</head>
<body>
  <div id="app-root" data-state="idle">
    <h1>단위 변환기</h1>
    <p aria-live="polite" data-role="state-text">상태: idle (대기 중)</p>

    <div class="tabs" role="tablist">
      <button type="button" id="tab-length" class="tab tab--active" role="tab" aria-selected="true">길이</button>
      <button type="button" id="tab-weight" class="tab" role="tab" aria-selected="false">무게</button>
      <button type="button" id="tab-temperature" class="tab" role="tab" aria-selected="false">온도</button>
    </div>

    <div id="panel-length" class="panel panel--active" role="tabpanel" aria-labelledby="tab-length">
      <label class="unit-row"><span>미터 (m)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="m"></label>
      <label class="unit-row"><span>킬로미터 (km)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="km"></label>
      <label class="unit-row"><span>센티미터 (cm)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="cm"></label>
      <label class="unit-row"><span>밀리미터 (mm)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="mm"></label>
      <label class="unit-row"><span>인치 (in)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="inch"></label>
      <label class="unit-row"><span>피트 (ft)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="feet"></label>
      <label class="unit-row"><span>마일 (mi)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="mile"></label>
    </div>

    <div id="panel-weight" class="panel" role="tabpanel" aria-labelledby="tab-weight">
      <label class="unit-row"><span>그램 (g)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="g"></label>
      <label class="unit-row"><span>킬로그램 (kg)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="kg"></label>
      <label class="unit-row"><span>밀리그램 (mg)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="mg"></label>
      <label class="unit-row"><span>파운드 (lb)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="lb"></label>
      <label class="unit-row"><span>온스 (oz)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="oz"></label>
    </div>

    <div id="panel-temperature" class="panel" role="tabpanel" aria-labelledby="tab-temperature">
      <label class="unit-row"><span>섭씨 (°C)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="C"></label>
      <label class="unit-row"><span>화씨 (°F)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="F"></label>
      <label class="unit-row"><span>켈빈 (K)</span><input type="text" inputmode="decimal" autocomplete="off" class="unit-input" data-unit="K"></label>
    </div>

    <p id="error-message" class="error-text" role="alert"></p>
  </div>

  <script>
    (function () {
      "use strict";

      // §2 계수 테이블 (기준 단위: length=m, weight=g) — §3 온도는 오프셋 포함 공식 사용
      var FACTORS = {
        length: { m: 1, km: 1000, cm: 0.01, mm: 0.001, inch: 0.0254, feet: 0.3048, mile: 1609.344 },
        weight: { g: 1, kg: 1000, mg: 0.001, lb: 453.59237, oz: 28.349523125 }
      };

      var ABSOLUTE_ZERO_C = -273.15;
      var EPSILON = 1e-9;

      var MESSAGES = {
        nonNumeric: "숫자를 입력해주세요.",
        absoluteZero: "절대영도(-273.15°C) 미만은 입력할 수 없습니다.",
        negative: "음수는 입력할 수 없습니다."
      };

      var appRoot = document.getElementById("app-root");
      var stateTextEl = document.querySelector('[data-role="state-text"]');
      var errorMessageEl = document.getElementById("error-message");

      var TABS = [
        { category: "length", tabEl: document.getElementById("tab-length"), panelEl: document.getElementById("panel-length") },
        { category: "weight", tabEl: document.getElementById("tab-weight"), panelEl: document.getElementById("panel-weight") },
        { category: "temperature", tabEl: document.getElementById("tab-temperature"), panelEl: document.getElementById("panel-temperature") }
      ];

      var categoryState = {
        length: { error: false, message: "" },
        weight: { error: false, message: "" },
        temperature: { error: false, message: "" }
      };

      var activeCategory = "length";

      function isNumeric(str) {
        if (typeof str !== "string") {
          return false;
        }
        var trimmed = str.trim();
        if (trimmed === "") {
          return false;
        }
        return Number.isFinite(Number(trimmed));
      }

      function toCelsius(value, unit) {
        if (unit === "C") {
          return value;
        }
        if (unit === "F") {
          return (value - 32) * 5 / 9;
        }
        return value - 273.15; // K
      }

      function fromCelsius(celsius, unit) {
        if (unit === "C") {
          return celsius;
        }
        if (unit === "F") {
          return celsius * 9 / 5 + 32;
        }
        return celsius + 273.15; // K
      }

      function formatNumber(num) {
        if (!Number.isFinite(num)) {
          return "";
        }
        var value = Object.is(num, -0) ? 0 : num;
        var fixed = value.toFixed(6);
        fixed = fixed.replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
        return fixed;
      }

      function renderActiveState() {
        var state = categoryState[activeCategory];
        if (state.error) {
          appRoot.setAttribute("data-state", "error");
          errorMessageEl.textContent = state.message;
          stateTextEl.textContent = "상태: error (오류)";
        } else {
          appRoot.setAttribute("data-state", "idle");
          errorMessageEl.textContent = "";
          stateTextEl.textContent = "상태: idle (대기 중)";
        }
      }

      function setCategoryError(category, message) {
        categoryState[category] = { error: true, message: message };
        if (category === activeCategory) {
          renderActiveState();
        }
      }

      function setCategoryIdle(category) {
        categoryState[category] = { error: false, message: "" };
        if (category === activeCategory) {
          renderActiveState();
        }
      }

      function handleLinearInput(category, panelEl, changedInput) {
        var raw = changedInput.value;
        var siblings = panelEl.querySelectorAll(".unit-input");

        if (!isNumeric(raw)) {
          setCategoryError(category, MESSAGES.nonNumeric);
          siblings.forEach(function (el) {
            if (el !== changedInput) {
              el.value = "";
            }
          });
          return;
        }

        var num = Number(raw.trim());

        if (num < 0) {
          setCategoryError(category, MESSAGES.negative);
          siblings.forEach(function (el) {
            if (el !== changedInput) {
              el.value = "";
            }
          });
          return;
        }

        var factors = FACTORS[category];
        var base = num * factors[changedInput.dataset.unit];
        siblings.forEach(function (el) {
          if (el === changedInput) {
            return;
          }
          el.value = formatNumber(base / factors[el.dataset.unit]);
        });
        setCategoryIdle(category);
      }

      function handleTemperatureInput(panelEl, changedInput) {
        var raw = changedInput.value;
        var siblings = panelEl.querySelectorAll(".unit-input");

        if (!isNumeric(raw)) {
          setCategoryError("temperature", MESSAGES.nonNumeric);
          siblings.forEach(function (el) {
            if (el !== changedInput) {
              el.value = "";
            }
          });
          return;
        }

        var num = Number(raw.trim());
        var celsius = toCelsius(num, changedInput.dataset.unit);

        if (celsius < ABSOLUTE_ZERO_C - EPSILON) {
          setCategoryError("temperature", MESSAGES.absoluteZero);
          siblings.forEach(function (el) {
            if (el !== changedInput) {
              el.value = "";
            }
          });
          return;
        }

        siblings.forEach(function (el) {
          if (el === changedInput) {
            return;
          }
          el.value = formatNumber(fromCelsius(celsius, el.dataset.unit));
        });
        setCategoryIdle("temperature");
      }

      TABS.forEach(function (tab) {
        var inputs = tab.panelEl.querySelectorAll(".unit-input");
        inputs.forEach(function (inputEl) {
          inputEl.addEventListener("input", function () {
            if (tab.category === "temperature") {
              handleTemperatureInput(tab.panelEl, inputEl);
            } else {
              handleLinearInput(tab.category, tab.panelEl, inputEl);
            }
          });
        });

        tab.tabEl.addEventListener("click", function () {
          activeCategory = tab.category;
          TABS.forEach(function (t) {
            var isActive = t.category === activeCategory;
            t.tabEl.classList.toggle("tab--active", isActive);
            t.tabEl.setAttribute("aria-selected", String(isActive));
            t.panelEl.classList.toggle("panel--active", isActive);
          });
          renderActiveState();
        });
      });

      renderActiveState();
    })();
  </script>
</body>
</html>
