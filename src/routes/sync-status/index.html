<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>동기화 상태 센터 · brix-Flow</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="center" role="main">
    <!-- 헤더 + 전체 새로고침 + aria-live 안내 -->
    <header class="center-header">
      <div class="center-header__row">
        <h1 class="center-header__title">동기화 상태 센터</h1>
        <button id="refresh-all" type="button" class="center-header__refresh">↻ 전체 새로고침</button>
      </div>
      <p class="center-header__hint">
        여러 저장소의 동기화 상태를 한 화면에서 확인합니다. 실제 원격 변경 없이 fixture 시나리오로 동작합니다.
      </p>
      <!-- 시각적 상태 텍스트 겸 aria-live 컨테이너 2종 (designer §8.3) -->
      <div class="center-header__live">
        <p id="live-polite" class="center-header__live-text" aria-live="polite" aria-atomic="true"></p>
        <p id="live-assertive" class="center-header__live-text" aria-live="assertive" aria-atomic="true"></p>
      </div>
    </header>

    <!-- 요약 카드 바 -->
    <section class="section" aria-label="상태 요약">
      <div class="section__head">
        <h2 class="section__title">요약</h2>
        <span class="section__meta">마지막 전체 동기화 <time id="last-full-sync">—</time></span>
      </div>
      <div id="summary-bar" class="summary-bar"></div>
      <!-- KPI 요약 (평균 확인 비용 · 재시도 성공률) -->
      <div id="kpi-summary" class="kpi-summary" aria-live="polite"></div>
    </section>

    <!-- 필터 바 -->
    <section class="section" aria-label="상태 필터">
      <div id="filter-bar" class="filter-bar segmented" role="group" aria-label="상태 필터"></div>
    </section>

    <!-- 저장소 목록 / 빈 상태 -->
    <section class="section" aria-label="저장소 목록">
      <h2 class="section__title">저장소</h2>
      <ul id="repo-list" class="repo-list"></ul>
      <div id="empty-state" class="empty-state" hidden></div>
    </section>
  </main>

  <!-- vanilla-static / file:// 호환: ESM 대신 UMD 스크립트 순차 로드 -->
  <script src="../../features/sync-status/fixtures.js"></script>
  <script src="../../features/sync-status/status.js"></script>
</body>
</html>
