<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Line Defense</title>
    <style>
      /* planner(§6) 동결 토큰 — design-tokens.html 와 동일 exact 값 */
      :root {
        --color-bg: #0f172a;
        --color-surface: #1e293b;
        --color-path: #475569;
        --color-tower: #38bdf8;
        --color-enemy: #f43f5e;
        --color-action-primary: #22c55e;
        --color-danger: #ef4444;
        --color-text: #e2e8f0;
        --font-size-hud: 16px;
        --font-size-title: 32px;
        --space-hud-gap: 12px;
        --radius-panel: 8px;
        --shadow-panel: 0 4px 12px rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-hud-gap);
        padding: 16px;
      }

      h1 {
        font-size: var(--font-size-title);
        margin: 8px 0;
      }

      /* HUD — 좁은 화면에서 wrap */
      .td-hud {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-hud-gap);
        width: 100%;
        max-width: 800px;
        justify-content: center;
      }

      .td-hud__stat {
        background: var(--color-surface);
        border-radius: var(--radius-panel);
        box-shadow: var(--shadow-panel);
        padding: 8px 14px;
        font-size: var(--font-size-hud);
        white-space: nowrap;
      }

      .td-hud__stat strong {
        color: var(--color-tower);
      }

      /* 컨트롤 버튼 */
      .td-controls {
        display: flex;
        gap: var(--space-hud-gap);
        flex-wrap: wrap;
        justify-content: center;
      }

      .td-button {
        font-size: var(--font-size-hud);
        color: var(--color-text);
        background: var(--color-surface);
        border: 1px solid var(--color-path);
        border-radius: var(--radius-panel);
        padding: 8px 18px;
        cursor: pointer;
      }

      .td-button:focus-visible {
        outline: 2px solid var(--color-tower);
        outline-offset: 2px;
      }

      .td-button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .td-button--primary {
        background: var(--color-action-primary);
        color: #06210f;
        border-color: var(--color-action-primary);
        font-weight: 700;
      }

      /* Stage — 컨테이너 폭에 맞춰 비율 유지 축소 */
      .td-stage {
        position: relative;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 800 / 480;
        background: var(--color-surface);
        border-radius: var(--radius-panel);
        box-shadow: var(--shadow-panel);
        overflow: hidden;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* 오버레이 */
      .td-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-hud-gap);
        text-align: center;
        padding: 16px;
        background: rgba(15, 23, 42, 0.86);
      }

      .td-overlay[hidden] {
        display: none;
      }

      .td-overlay__title {
        font-size: var(--font-size-title);
        margin: 0;
      }

      #overlay-gameover .td-overlay__title {
        color: var(--color-danger);
      }

      .td-hint {
        font-size: var(--font-size-hud);
        opacity: 0.85;
        max-width: 480px;
      }
    </style>
  </head>
  <body>
    <h1>Line Defense</h1>

    <!-- HUD -->
    <section class="td-hud" aria-label="게임 상태 표시">
      <div class="td-hud__stat" id="hud-resource">자원: <strong>100</strong></div>
      <div class="td-hud__stat" id="hud-lives">생명: <strong>20</strong></div>
      <div class="td-hud__stat" id="hud-score">점수: <strong>0</strong></div>
      <div class="td-hud__stat" id="hud-wave">웨이브: <strong>1</strong></div>
    </section>

    <!-- 컨트롤 -->
    <div class="td-controls">
      <button type="button" class="td-button" id="btn-pause" aria-label="게임 일시정지">
        일시정지
      </button>
      <button type="button" class="td-button" id="btn-restart" aria-label="게임 재시작">
        재시작
      </button>
    </div>

    <!-- 게임 화면 -->
    <div class="td-stage">
      <canvas
        id="game-canvas"
        width="800"
        height="480"
        aria-label="타워 디펜스 게임 화면: 경로를 따라 오는 적을 타워로 막습니다"
        role="img"
      ></canvas>

      <!-- 시작 오버레이 -->
      <div class="td-overlay" id="overlay-start" aria-live="polite">
        <p class="td-overlay__title">Line Defense — 시작</p>
        <p class="td-hint">
          캔버스를 클릭해 타워(50 자원)를 설치하고, 경로 끝에 도달하는 적을 막으세요. 적을
          처치하면 자원과 점수를 얻습니다.
        </p>
        <button type="button" class="td-button td-button--primary" id="btn-start" aria-label="게임 시작">
          게임 시작
        </button>
      </div>

      <!-- 게임오버 오버레이 -->
      <div class="td-overlay" id="overlay-gameover" aria-live="polite" hidden>
        <p class="td-overlay__title">게임 오버</p>
        <p class="td-hint" id="gameover-summary">최종 점수: 0</p>
        <button
          type="button"
          class="td-button td-button--primary"
          id="btn-gameover-restart"
          aria-label="게임 다시 시작"
        >
          다시 시작
        </button>
      </div>
    </div>

    <script type="module" src="./src/render.js"></script>
  </body>
</html>
