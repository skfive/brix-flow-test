<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>전달 상태 배지</title>
  <style>
    :root {
      --color-status-delivered: #16a34a;
      --color-status-failed: #dc2626;
      --space-badge-gap: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2937;
    }

    .delivery-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-badge-gap);
      max-width: 100%;
      flex-wrap: wrap;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
    }

    .delivery-badge__status {
      font-weight: 600;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    /* 색상은 상태명 화면 텍스트를 보조할 뿐, 색상만으로 상태를 구분하지 않는다. */
    .delivery-badge[data-state="delivered"] .delivery-badge__status {
      color: var(--color-status-delivered);
    }

    .delivery-badge[data-state="failed"] .delivery-badge__status {
      color: var(--color-status-failed);
    }

    .delivery-badge__refresh {
      flex: none;
      padding: 4px 10px;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      background: #ffffff;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .delivery-badge__refresh:disabled {
      cursor: default;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="delivery-badge-root" class="delivery-badge" data-state="idle">
    <span
      id="delivery-badge-status"
      class="delivery-badge__status"
      aria-live="polite"
    >대기 중</span>
    <button
      id="delivery-badge-refresh"
      class="delivery-badge__refresh"
      type="button"
      aria-label="상태 새로고침"
    >새로고침</button>
  </div>

  <script type="module" src="./src/badge.js"></script>
</body>
</html>
