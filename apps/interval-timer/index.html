<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인터벌 타이머</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="timer-root" class="timer">
      <p id="timer-phase-label" class="timer__phase-label">대기</p>
      <div id="timer-display" class="timer__display" aria-live="polite">25:00</div>
      <p id="timer-round-count" class="timer__round-count">1 / 4</p>
      <div class="timer__control">
        <button id="timer-start-pause" type="button" aria-label="시작">시작</button>
        <button id="timer-reset" type="button" aria-label="리셋">리셋</button>
      </div>
    </main>
    <script src="./timer.js"></script>
  </body>
</html>
