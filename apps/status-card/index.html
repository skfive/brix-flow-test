<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상태 카드 — 새로고침</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="status-card" aria-labelledby="status-card-heading">
      <h1 id="status-card-heading" class="status-card__heading">상태 카드</h1>

      <!-- 상태 텍스트 영역 — aria-live="polite" 로 갱신 결과를 낭독 -->
      <p
        id="status-card-status-text"
        class="status-card__status-text"
        aria-live="polite"
        data-state="idle"
      >
        최근 상태를 확인하려면 새로고침하세요.
      </p>

      <!-- 마지막 갱신 시각 (성공 시 노출) -->
      <p id="status-card-last-updated" class="status-card__last-updated" hidden></p>

      <!--
        확장 health 필드 표시 영역 (BF-1633) — uptimeSec/version 을 소비해 렌더한다.
        구버전 infra(uptimeSec/version 부재) 응답에서는 대체 텍스트로 상태명을 노출해
        카드를 깨뜨리지 않는다. 초기값도 대체 텍스트라 undefined/NaN 을 드러내지 않는다.
      -->
      <p id="status-card-uptime" class="status-card__uptime">가동 시간 정보 없음</p>
      <p id="status-card-version" class="status-card__version">버전 정보 없음</p>

      <div class="status-card__actions">
        <!-- 주 실행 control (새로고침 버튼) -->
        <button
          id="status-card-refresh-button"
          type="button"
          class="status-card__refresh"
          aria-label="상태 새로고침"
          aria-busy="false"
        >
          새로고침
        </button>

        <!-- error 상태 재시도 control (기본 숨김) -->
        <button
          id="status-card-retry-action"
          type="button"
          class="status-card__retry"
          hidden
        >
          다시 시도
        </button>
      </div>
    </main>

    <!--
      vanilla-static(빌드 도구 없음) 서빙 환경에서는 브라우저가 .ts 를 실행하지 못하므로
      타입 계약 원본(src/refresh.ts)과 동일 로직의 실행 아티팩트 src/refresh.js 를 로드한다.
    -->
    <script src="./src/refresh.js" defer></script>
  </body>
</html>
