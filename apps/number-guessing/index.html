<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>숫자 맞히기 게임</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <h1 class="game__title">숫자 맞히기 게임</h1>
      <p class="game__intro">1~100 사이의 비밀 숫자를 맞혀 보세요.</p>

      <!-- §8 novalidate: native 검증이 invalid 상태 제출을 가로채지 않게 한다(회귀 방지) -->
      <form id="guess-form" class="game__form" novalidate>
        <input
          id="guess-input"
          class="game__input"
          type="number"
          min="1"
          max="100"
          step="1"
          inputmode="numeric"
          aria-label="추측할 숫자 입력"
          autocomplete="off"
        />
        <button id="guess-submit" class="game__submit" type="submit" aria-label="추측 제출">
          제출
        </button>
      </form>

      <p id="guess-feedback" class="game__feedback" data-state="idle" aria-live="polite" role="status">
        1~100 사이 숫자를 입력하세요
      </p>

      <div class="game__stats">
        <p class="game__stat">시도 횟수: <span id="attempts-count">0</span></p>
        <p class="game__stat">최고 기록: <span id="best-score">기록 없음</span></p>
      </div>

      <button id="new-game" class="game__new-game" type="button">새 게임</button>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
