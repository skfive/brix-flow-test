<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG 슬라이딩 퍼즐 — 정적 시안(Mockup)</title>
    <!-- 실제 런타임 스타일을 그대로 참조해 시안과 구현이 일치하도록 한다 -->
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .mockup-note {
        max-width: 460px;
        margin: 0 auto 12px;
        font-size: 0.85rem;
        color: #94a3b8;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="puzzle-page">
      <section class="puzzle" data-state="playing" aria-labelledby="mock-title">
        <h1 id="mock-title">SVG 슬라이딩 퍼즐</h1>
        <p class="mockup-note">
          정적 UI 시안 — frozen selector/token 기준 레이아웃 참조(로직 없음).
        </p>

        <div class="puzzle__hud">
          <p class="puzzle__stat">이동 횟수: <span id="move-count">7</span></p>
          <p class="puzzle__stat">경과 시간: <span id="elapsed-time">00:42</span></p>
          <p class="puzzle__stat" id="puzzle-status">상태: 진행 중</p>
        </div>

        <div class="puzzle__board-wrap">
          <svg
            id="puzzle-board"
            class="puzzle__board"
            viewBox="0 0 392 392"
            role="group"
            aria-label="4x4 슬라이딩 퍼즐 보드(시안)"
          >
            <g id="puzzle-tiles">
              <!-- 정적 샘플 배치: 1..15 + 빈 칸(우하단) -->
              <g class="puzzle__tile" transform="translate(8, 8)" aria-label="타일 1">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">1</text>
              </g>
              <g class="puzzle__tile" transform="translate(104, 8)" aria-label="타일 2">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">2</text>
              </g>
              <g class="puzzle__tile puzzle__tile--movable" transform="translate(200, 8)" aria-label="타일 3">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">3</text>
              </g>
              <g class="puzzle__tile" transform="translate(296, 8)" aria-label="타일 4">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">4</text>
              </g>
              <g class="puzzle__tile" transform="translate(8, 104)" aria-label="타일 5">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">5</text>
              </g>
              <g class="puzzle__tile" transform="translate(104, 104)" aria-label="타일 6">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">6</text>
              </g>
              <g class="puzzle__tile" transform="translate(200, 104)" aria-label="타일 7">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">7</text>
              </g>
              <g class="puzzle__tile" transform="translate(296, 104)" aria-label="타일 8">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">8</text>
              </g>
              <g class="puzzle__tile" transform="translate(8, 200)" aria-label="타일 9">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">9</text>
              </g>
              <g class="puzzle__tile" transform="translate(104, 200)" aria-label="타일 10">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">10</text>
              </g>
              <g class="puzzle__tile" transform="translate(200, 200)" aria-label="타일 11">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">11</text>
              </g>
              <g class="puzzle__tile puzzle__tile--movable" transform="translate(296, 200)" aria-label="타일 12">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">12</text>
              </g>
              <g class="puzzle__tile" transform="translate(8, 296)" aria-label="타일 13">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">13</text>
              </g>
              <g class="puzzle__tile" transform="translate(104, 296)" aria-label="타일 14">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">14</text>
              </g>
              <g class="puzzle__tile puzzle__tile--movable" transform="translate(200, 296)" aria-label="타일 15">
                <rect width="88" height="88" rx="12" class="puzzle__tile-rect" />
                <text x="44" y="44" text-anchor="middle" dominant-baseline="central" class="puzzle__tile-text">15</text>
              </g>
              <!-- 우하단(296,296) 은 빈 칸: puzzle__tile--empty (노드 없음/시각 숨김) -->
            </g>
          </svg>
        </div>

        <div class="puzzle__controls">
          <button id="restart-button" type="button" class="puzzle__restart" aria-label="퍼즐 재시작">
            재시작
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
