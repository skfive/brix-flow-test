<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provider 실행 준비 상태</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section
        id="readiness-card"
        class="readiness-card"
        role="region"
        aria-label="실행 모드 및 Provider 준비 상태"
      >
        <div class="readiness-card__mode">
          <span class="readiness-card__label">실행 모드</span>
          <span id="readiness-mode">확인 중…</span>
        </div>
        <div class="readiness-card__provider">
          <span class="readiness-card__label">Provider</span>
          <span id="readiness-provider">확인 중…</span>
        </div>
        <p
          id="readiness-status"
          class="readiness-card__status is-loading"
          aria-live="polite"
        >
          확인 중…
        </p>
        <a
          id="readiness-settings-link"
          class="readiness-card__settings-link"
          href="#settings"
          aria-label="Provider 설정 화면으로 이동"
          hidden
          >설정으로 이동</a
        >
        <button
          id="readiness-retry"
          class="readiness-card__retry"
          type="button"
          aria-label="상태 다시 확인"
          hidden
        >
          다시 시도
        </button>
      </section>
    </main>
    <script type="module">
      import { initReadinessCard } from './src/readiness-card.js';
      initReadinessCard();
    </script>
  </body>
</html>
