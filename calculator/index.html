<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계산기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="calculator-app" class="calculator" data-phase="input-entry">
    <h1 class="calculator__title">계산기</h1>
    <p id="calculator-phase" class="calculator__phase">입력중</p>

    <div
      id="calculator-display"
      class="calculator__display"
      role="status"
      aria-live="polite"
    >0</div>

    <div id="calculator-keypad" class="calculator__keypad">
      <button type="button" class="calculator__button" data-key="C" aria-label="초기화">C</button>
      <button type="button" class="calculator__button" data-key="±" aria-label="부호 전환">±</button>
      <div class="calculator__spacer" aria-hidden="true"></div>
      <button type="button" class="calculator__button calculator__button--operator" data-key="/" aria-label="나누기">÷</button>

      <button type="button" class="calculator__button" data-key="7" aria-label="숫자 7">7</button>
      <button type="button" class="calculator__button" data-key="8" aria-label="숫자 8">8</button>
      <button type="button" class="calculator__button" data-key="9" aria-label="숫자 9">9</button>
      <button type="button" class="calculator__button calculator__button--operator" data-key="*" aria-label="곱하기">×</button>

      <button type="button" class="calculator__button" data-key="4" aria-label="숫자 4">4</button>
      <button type="button" class="calculator__button" data-key="5" aria-label="숫자 5">5</button>
      <button type="button" class="calculator__button" data-key="6" aria-label="숫자 6">6</button>
      <button type="button" class="calculator__button calculator__button--operator" data-key="-" aria-label="빼기">-</button>

      <button type="button" class="calculator__button" data-key="1" aria-label="숫자 1">1</button>
      <button type="button" class="calculator__button" data-key="2" aria-label="숫자 2">2</button>
      <button type="button" class="calculator__button" data-key="3" aria-label="숫자 3">3</button>
      <button type="button" class="calculator__button calculator__button--operator" data-key="+" aria-label="더하기">+</button>

      <button type="button" class="calculator__button calculator__button--zero" data-key="0" aria-label="숫자 0">0</button>
      <button type="button" class="calculator__button" data-key="." aria-label="소수점">.</button>
      <button
        type="button"
        class="calculator__button calculator__button--operator calculator__button--equals"
        data-key="="
        aria-label="계산"
      >=</button>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
