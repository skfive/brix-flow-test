<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카드 짝맞추기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="app">
  <h1>카드 짝맞추기</h1>
  <p class="status-bar">시도 횟수: <span id="move-counter" aria-live="polite">0</span></p>
  <div id="game-board" class="board" role="group" aria-label="카드 보드"></div>
  <p id="completion-message" aria-live="polite"></p>
  <button id="restart-button" type="button">다시 시작</button>
</main>
<script src="memory.js"></script>
</body>
</html>
