<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>뽀모도로 타이머</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="timer mode-focus" id="pomodoro-timer">
      <h1 class="timer__title">뽀모도로 타이머</h1>

      <p class="timer__mode" id="timer-mode">집중</p>

      <p class="timer__display" id="timer-display" aria-live="polite">25:00</p>

      <p class="timer__count">완료한 집중 세션 <span id="timer-count">0</span></p>

      <div class="timer__controls">
        <button type="button" class="timer__button" id="btn-start" aria-label="시작">시작</button>
        <button type="button" class="timer__button" id="btn-pause" aria-label="일시정지" disabled>
          일시정지
        </button>
        <button type="button" class="timer__button" id="btn-reset" aria-label="리셋">리셋</button>
      </div>
    </main>

    <!-- 비-module script — file:// CORS 안전 (pomodoro/package.json: "type": "commonjs") -->
    <script src="./pomodoro.js"></script>
  </body>
</html>
