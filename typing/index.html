<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타자 연습기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="typing-root" class="typing-app" data-state="idle">
    <h1 class="typing-app__title">타자 연습기</h1>

    <p id="status-text" class="typing-app__status" role="status">대기 중 — 입력을 시작하세요</p>

    <p id="prompt-text" class="typing-app__prompt" aria-label="목표 문장"></p>

    <div class="typing-app__control-row">
      <input
        id="typed-input"
        class="typing-app__input"
        type="text"
        aria-label="타이핑 연습 입력"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button id="restart-button" class="btn-restart" type="button" aria-label="다시 시작">다시 시작</button>
    </div>

    <p id="paste-warning" class="typing-app__paste-warning" role="alert" hidden>붙여넣기는 허용되지 않습니다. 직접 입력해 주세요.</p>

    <div id="stats-panel" class="stats-panel">
      <p class="stats-panel__row">WPM: <span id="wpm-value">0</span></p>
      <p class="stats-panel__row">정확도: <span id="accuracy-value">0</span>%</p>
      <p class="stats-panel__row">오타 수: <span id="error-count-value">0</span>개</p>
    </div>
  </main>

  <script src="typing.js"></script>
</body>
</html>
